}
function closeCook(){ cookStopTimer(); cookWakeOff(); set({cook:null,cookStep:0,cookIng:false}); }
function cookGo(delta){
  const steps=(S.cook.rc.steps||[]);
  const n=Math.max(0,Math.min(steps.length-1,S.cookStep+delta));
  if(n!==S.cookStep){cookStopTimer();set({cookStep:n});}
}

// Zoekt een tijdsduur in de staptekst: "10 min", "1 uur", "20 seconden".
function stepSeconds(txt){
  const t=(txt||"").toLowerCase();
  let m=t.match(/(\d+)\s*(?:-|tot|à|a)\s*(\d+)\s*(min|minuut|minuten|uur|sec|seconde|seconden)/);
  if(m)return toSec(parseInt(m[2]),m[3]);
  m=t.match(/(\d+)\s*(min|minuut|minuten|uur|sec|seconde|seconden)/);
  if(m)return toSec(parseInt(m[1]),m[2]);
  return 0;
}
function toSec(n,unit){ return /uur/.test(unit)?n*3600:/sec/.test(unit)?n:n*60; }
function fmtTime(s){ const m=Math.floor(s/60),r=s%60; return `${m}:${String(r).padStart(2,"0")}`; }

function cookStartTimer(sec,label){
  cookStopTimer();
  _cookEnd=Date.now()+sec*1000; _cookLabel=label||"";
  _cookInt=setInterval(cookTick,250);
  cookTick();
}
function cookStopTimer(){ if(_cookInt){clearInterval(_cookInt);_cookInt=null;} _cookEnd=0; const el=document.getElementById("cook-timer"); if(el)el.remove(); }
function cookTick(){
  const host=document.getElementById("cook-timer-host"); if(!host){cookStopTimer();return;}
  const left=Math.max(0,Math.round((_cookEnd-Date.now())/1000));
  let el=document.getElementById("cook-timer");
  if(!el){ el=document.createElement("div"); el.id="cook-timer"; host.appendChild(el); }
  el.className="cook-timer";
  const stopBtn=`<button onclick="cookStopTimer()" style="background:color-mix(in oklch,currentColor 20%,transparent);border-radius:var(--r-sm);padding:5px 10px;font-size:var(--t-xs);color:inherit">stop</button>`;
  el.innerHTML=`<span class="cook-timer-num">${fmtTime(left)}</span>
    <span style="flex:1;font-size:var(--t-xs);opacity:.85">${esc(_cookLabel)}</span>${stopBtn}`;
  if(left<=0){ clearInterval(_cookInt); _cookInt=null; cookAlarm();
    el.innerHTML=`<span class="cook-timer-num">klaar</span>
      <span style="flex:1;font-size:var(--t-xs);opacity:.85">${esc(_cookLabel)}</span>${stopBtn}`; }
}
function cookAlarm(){
  try{ if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]); }catch(e){}
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const ac=new AC();
    [0,0.35,0.7].forEach(t=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.25);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.3);
    });
    setTimeout(()=>{try{ac.close()}catch(e){}},2000);
  }catch(e){}
  toast("Timer klaar");
}

// Zet de pagina achter een open modal vast, zodat die niet meescrollt.
let _lockY=0;
function modalOpen(){
  return !!(S.picker||S.detail||S.boodDetail!==null||S.wizOpen||S.addOpen||S.syncOpen||S.cook||S.leftoverPick);
}
function syncBodyLock(){
  const b=document.body, open=modalOpen(), locked=b.classList.contains('modal-open');
  if(open&&!locked){
    _lockY=window.scrollY;
    b.style.top=`-${_lockY}px`;
    b.classList.add('modal-open');
  }else if(!open&&locked){
    b.classList.remove('modal-open');
    b.style.top='';
    window.scrollTo(0,_lockY);
  }
}
// Waar een veld na het hertekenen terug te vinden is. Een id is het meest
// betrouwbaar; anders vallen we terug op de eerste klasse.
function veldSelector(el){
  if(!el)return null;
  if(el.id)return "#"+CSS.escape(el.id);
  const cls=(typeof el.className==="string"?el.className:"").trim().split(/\s+/)[0];
  return cls?"."+CSS.escape(cls):null;
}

function render(){
  _etersCache=null;
  // Een hertekening mag nooit wegvagen wat iemand op dat moment intypt.
  // De achtergrondsync kan er middenin vallen, dus bewaren we waarde,
  // focus én cursorpositie van het veld waar de cursor staat.
  const active=document.activeElement;
  const isVeld=!!active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA");
  const veld=isVeld?{
    sel:veldSelector(active),
    waarde:active.value,
    start:active.selectionStart,
    eind:active.selectionEnd,
  }:null;

  // Save scroll positions before re-render (beide assen: de weekstrip scrollt horizontaal)
  const scrollMap={};
  document.querySelectorAll('*').forEach(el=>{
    if(el.scrollTop>0||el.scrollLeft>0){
      const cls=(typeof el.className==='string')?el.className.trim():'';
      const key=cls?cls.split(/\s+/)[0]:null;
      if(key&&!scrollMap[key]) scrollMap[key]={top:el.scrollTop,left:el.scrollLeft};
    }
  });
  const winScrollY=window.scrollY;

  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="shell">
      ${renderBottomNav()}
      <main class="app">
        ${S.view==="planner"?renderPlanner():""}
        ${S.view==="recepten"?renderRecepten():""}
        ${S.view==="snacks"?renderSnacks():""}
        ${S.view==="mealpreps"?renderMealpreps():""}
        ${S.view==="boodschappen"?renderBoodschappen():""}
      </main>
    </div>
    ${S.picker?renderPicker():""}
    ${S.detail?renderDetail():""}
    ${S.boodDetail!==null?renderBoodDetail():""}
    ${S.wizOpen?renderWizard():""}
    ${S.addOpen?renderAddSheet():""}
    ${S.syncOpen?renderSyncModal():""}
    ${S.leftoverPick?renderLeftoverPick():""}
    ${S.cook?renderCookMode():""}
    ${S.tour!==null&&S.tour!==undefined?renderTour():""}
  `;

  // Restore scroll positions
  if(winScrollY>0) window.scrollTo(0,winScrollY);
  Object.entries(scrollMap).forEach(([key,pos])=>{
    const el=document.querySelector('.'+key);
    if(!el)return;
    if(pos.top) el.scrollTop=pos.top;
    if(pos.left) el.scrollLeft=pos.left;
  });

  syncBodyLock();
  tourMarkeer();

  if(S.addOpen)document.querySelectorAll("[data-voor]").forEach(b=>b.classList.toggle("on",b.dataset.voor===S.formVoor));

  if(veld&&veld.sel){
    const el=document.querySelector(veld.sel);
    if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){
      if(el.value!==veld.waarde)el.value=veld.waarde;
      el.focus({preventScroll:true});
      try{ if(veld.start!==null)el.setSelectionRange(veld.start,veld.eind); }catch(e){}
    }
  }
}

    if(S.recFilter!=="all"&&S.recFilter!=="fav"&&rc.category!==S.recFilter)return false;
    if(S.recFilter==="fav"&&rc.ebook!==0)return false;
    if(S.recVoor!=="all"&&rc.voor!==S.recVoor&&rc.voor!=="beiden")return false;
    if(S.search&&!rc.name.toLowerCase().includes(S.search.toLowerCase()))return false;
    return true;
  });
  const filters=[["all","Alle"],["fav","Eigen"],["ontbijt","Ontbijt"],["lunch","Lunch"],["diner","Diner"],["tussendoortje","Tussendoor"]];
  return `
  <div class="view">
    <div class="page-head">
      <h1 class="page-title">Receptenkast</h1>
      <p class="page-sub">${alle.length} recepten, waarvan ${favCount} van jullie zelf.</p>
    </div>
    <input id="zoek-recepten" class="search" placeholder="Zoek op gerecht…" value="${esc(S.search)}"
      oninput="S.search=this.value;clearTimeout(window._st);window._st=setTimeout(render,200)">
    <div class="chips">
      ${filters.map(([k,l])=>`<button class="chip ${S.recFilter===k?"active":""}" onclick="set({recFilter:'${k}'})">${l}</button>`).join("")}
      ${eetMee("shelley")?`<button class="chip ${S.recVoor==="shelley"?"active":""}" onclick="set({recVoor:S.recVoor==='shelley'?'all':'shelley'})">Voor Shelley</button>`:""}
      <button class="chip ${S.recVoor==="dirk"?"active":""}" onclick="set({recVoor:S.recVoor==='dirk'?'all':'dirk'})">Voor Dirk</button>
    </div>
    <button class="btn btn-line" style="margin-bottom:var(--s-4)"
      onclick="set({addOpen:true,editRc:null,addTab:'manual',formVoor:'beiden',addCat:null})">${ic("plus",17)} Recept toevoegen</button>
    ${list.length===0?`<div class="empty"><div class="empty-title">Niets gevonden</div><p>Probeer een andere zoekterm of filter.</p></div>`
      :`<div class="reclist">${list.map(rc=>renderRecCard(rc)).join("")}</div>`}
  </div>`;
}

// los van het weekmenu, dus wat hier verschilt is alleen tekst en categorie.

function renderLossePagina(cat){
  const t=LOSSE_PAGINA[cat];

      onclick="set({addOpen:true,editRc:null,addTab:'manual',formVoor:'beiden',addCat:'${cat}'})">${ic("plus",17)} ${t.toevoegen}</button>
    ${list.length===0?`<div class="empty">
      <div class="empty-title">${all.length?"Niets gevonden":t.leeg}</div>

const renderSnacks=()=>renderLossePagina("weekendsnack");
const renderMealpreps=()=>renderLossePagina("mealprep");

function renderRecCard(rc){

  return `
  <div class="rec">
    <button class="rec-body" onclick="openDetail(${rc.id})" style="text-align:left;background:none">

// ---------- BOODSCHAPPEN ----------
function renderBoodschappen(){
  const vast=boodLijst();
  const grouped=boodGroepen();
  window.__boodList=[];
  const all=Object.values(grouped).flat();
  const total=all.length;
  const done=all.filter(it=>S.checked[it.name.toLowerCase()]).length;
  const pct=total?Math.round(done/total*100):0;
  const gewijzigd=boodVerschil(vast);
  const W=curWeek();

  const kop=vast?`
    <div class="lijstkop">
      <div class="lijstkop-rij">
        <span class="lijstkop-titel">Lijst opgemaakt</span>
        <span class="num lijstkop-tijd">${datumKort(vast.op)}</span>
      </div>
      <p class="lijstkop-sub">Voor ${esc(namenOp(vast.eters))} ·
        <span class="num">${vast.dagen}</span> dagen ·
        <span class="num">${vast.maaltijden}</span> maaltijden ·
        <span class="num">${(vast.items||[]).length}</span> regels</p>
    </div>
    ${gewijzigd?`<div class="lijstwaarschuwing">
      <div>
        <strong>Je week is aangepast</strong>
        <p><span class="num">${gewijzigd}</span> ${gewijzigd===1?"maaltijd wijkt":"maaltijden wijken"} af van deze lijst. Je vinkjes blijven staan.</p>
      </div>
      <button class="btn btn-primary" onclick="lijstBijwerken()">${ic("opnieuw",17)} Bijwerken</button>
    </div>`:""}`
  :`
    <div class="lijstkop lijstkop-los">
      <div class="lijstkop-rij">
        <span class="lijstkop-titel">Nog niet opgemaakt</span>
      </div>
      <p class="lijstkop-sub">Deze lijst beweegt mee met je week. Maak hem op zodra het menu klaar is, dan verandert hij niet meer onder je handen.</p>
      <button class="btn btn-primary" style="margin-top:var(--s-3)" onclick="lijstOpmaken()">${ic("vink",17)} Lijst opmaken</button>
    </div>`;

  return `
  <div class="view">
    <div class="page-head">
      <h1 class="page-title">Boodschappen</h1>
      <p class="page-sub">Week ${W.wk} · ${esc(S.cfg.store)}</p>
    </div>
    ${total===0&&!vast?`<div class="empty">
      <div class="empty-title">Nog leeg</div>
      <p>Vul eerst het weekmenu in. De lijst schrijft zichzelf.</p></div>`:`
    ${kop}
    <div class="progress">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3)">
        <span style="font-weight:600;font-size:var(--t-md)">${total&&done===total?"Alles in huis":"Onderweg"}</span>
        <span class="num" style="font-size:var(--t-sm);color:var(--ink-3)">${done} / ${total}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="bood-acties">
      <button class="btn btn-line" onclick="deelBood()">${ic("delen",17)} Delen</button>
      <button class="btn btn-line" onclick="kopieerBood()">${ic("plakken",17)} Kopiëren</button>
      <button class="btn btn-line" onclick="exportBoodImg('jpg')">${ic("afbeelding",17)} Foto</button>
      <button class="btn btn-line" onclick="exportBoodImg('pdf')">${ic("bestand",17)} PDF</button>
      <button class="btn btn-line" onclick="set({checked:{}})">${ic("opnieuw",17)} Vinkjes wissen</button>
      ${vast?`<button class="btn btn-line" onclick="lijstLosmaken()">${ic("wissen",17)} Lijst loslaten</button>`:""}
    </div>
    ${Object.entries(BOOD_CATS).map(([cat,obj])=>{
      const items=grouped[cat]||[];if(!items.length)return"";
      const catDone=items.filter(it=>S.checked[it.name.toLowerCase()]).length;
      return `<div class="bood-group">
        <div class="bood-head">
          <span class="bood-title">${obj.label}</span>
          <span class="num" style="font-size:var(--t-xs);color:var(--ink-3)">${catDone}/${items.length}</span>
        </div>
        <div class="bood-list">
        ${items.map(it=>{
          const idx=window.__boodList.length; window.__boodList.push(it);
          const k=it.name.toLowerCase();const chk=!!S.checked[k];
          const amt=S.boodOverride[k]||it.amount||"";
          const eigen=!!S.boodOverride[k];
          return `<div class="bood-item ${chk?"checked":""}">
            <button class="check ${chk?"on":""}" onclick="toggleCheck('${k.replace(/'/g,"")}')"
              role="checkbox" aria-checked="${chk}" aria-label="${esc(it.name)}">${chk?ic("vink",13):""}</button>
            <button class="bi-name" style="text-align:left;background:none" onclick="openBoodDetail(${idx})">${esc(it.name)}</button>
            ${amt?`<span class="bi-amt" ${eigen?'style="color:var(--accent)"':""}>${esc(amt)}</span>`:""}
          </div>`;
        }).join("")}
        </div>
      </div>`;
    }).join("")}
    `}
  </div>`;
}

function renderBoodDetail(){
  const it=window.__boodList&&window.__boodList[S.boodDetail];
  if(!it) return "";
  const k=it.name.toLowerCase();
  const safeK=k.replace(/'/g,"");
  const hasOverride=!!S.boodOverride[k];
  const currentAmt=S.boodOverride[k]||it.amount||(it.amounts||[]).join(" + ");
  const seen=new Set();
  const uniqSources=(it.sources||[]).filter(s=>{
    const key=s.day+s.rcName; if(seen.has(key))return false; seen.add(key); return true;
  });
  return `
  <div class="overlay" onclick="closeBoodDetail()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-head">
        <div style="flex:1">
          <h2 class="sheet-title">${esc(it.name)}</h2>
          <p class="sheet-sub">Komt terug in ${uniqSources.length} ${uniqSources.length===1?"maaltijd":"maaltijden"}.</p>
        </div>
        <button class="iconbtn" onclick="closeBoodDetail()" aria-label="Sluiten">${ic("sluiten",18)}</button>
      </div>
      <div style="margin-bottom:var(--s-5)">
        ${uniqSources.map(s=>`
        <div class="ing-line">
          <span><span class="num" style="color:var(--ink-3);font-size:var(--t-xs);margin-right:var(--s-2)">${(DAY_FULL[s.day]||s.day).slice(0,2)}</span>${esc(s.rcName)}</span>
          <span class="num" style="color:var(--ink-2);font-size:var(--t-sm)">${esc(s.amount)}</span>
        </div>`).join("")}
      </div>
      <div class="field">
        <label for="bood-amt-input">Hoeveelheid aanpassen</label>
        <div style="display:flex;gap:var(--s-2)">
          <input id="bood-amt-input" type="text" value="${esc(currentAmt)}" placeholder="bijv. 200g">
          <button class="btn btn-ink" style="width:auto;flex:0 0 auto" onclick="saveBoodOverride('${safeK}')">Opslaan</button>
        </div>
      </div>
      ${hasOverride?`<button class="btn btn-line" onclick="deleteBoodOverride('${safeK}')">Aanpassing verwijderen</button>`:""}
    </div>
  </div>`;
}

      <div class="sheet-head">
        <div style="flex:1">
          <h2 class="sheet-title">Restjes van welke dag?</h2>

function assignLeftover(day,rowId,rcId){
  const rc=getRc(rcId);if(!rc)return;
  S.week[day]={...S.week[day],[rowId]:makeLeftover(rc)};
  set({leftoverPick:null});
  toast("Restjes ingepland");
}

// Twee tellers naast elkaar: waar het recept voor geschreven is, en voor
// hoeveel monden je het nu maakt. Het verschil is de schaalfactor.
function stepper(waarde,minus,plus,label,hint){
  return `
  <div style="flex:1;min-width:0">
    <div style="font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin-bottom:var(--s-2)">${label}</div>
    <div style="display:flex;align-items:center;gap:var(--s-2)">
      <button class="iconbtn bordered" onclick="${minus}" aria-label="Minder" ${waarde<=1?"disabled":""}>${ic("minder",16)}</button>
      <span class="num" style="font-size:var(--t-lg);font-weight:700;min-width:1.6rem;text-align:center">${waarde}</span>
      <button class="iconbtn bordered" onclick="${plus}" aria-label="Meer" ${waarde>=24?"disabled":""}>${ic("plus",16)}</button>
    </div>
    ${hint?`<div style="font-size:var(--t-2xs);color:var(--ink-3);margin-top:var(--s-1);line-height:1.4">${hint}</div>`:""}
  </div>`;
}

function renderPorties(rc,day,rowId){
  const basis=rcPorties(rc);
  const rcArg=typeof rc.id==='number'?rc.id:`'${rc.id}'`;
  const nu=(day&&rowId)?slotPorties(day,rowId):basis;
  const eigen=(day&&rowId)&&Number((S.week[day]||{})[rowId]?.porties)>0;
  return `
  <div style="display:flex;gap:var(--s-5);padding:var(--s-3) 0 var(--s-4);border-bottom:1px solid var(--line);margin-bottom:var(--s-3)">
    ${stepper(basis,`setRcPorties(${rcArg},${basis-1})`,`setRcPorties(${rcArg},${basis+1})`,
      "Recept is voor","Klopt het recept niet? Zet hier het echte aantal.")}
    ${(day&&rowId)?stepper(nu,`setSlotPorties('${day}','${rowId}',${nu-1})`,`setSlotPorties('${day}','${rowId}',${nu+1})`,
      "Je kookt voor", eigen?`<button class="btn-quiet" style="padding:0;font-size:var(--t-2xs);text-decoration:underline" onclick="setSlotPorties('${day}','${rowId}',0)">terug naar ${slotEters(day,rowId)}</button>`
        :"Standaard: iedereen die mee-eet."):""}
  </div>
  ${nu!==basis?`<p style="font-size:var(--t-xs);color:var(--ink-3);margin-bottom:var(--s-2)">
    Hoeveelheden hieronder zijn omgerekend van ${basis} naar ${nu} ${nu===1?"persoon":"personen"}.</p>`:""}`;
}

// ---------- WIZARD HELPERS ----------

// Kandidaten wegen in plaats van blind uit een geschudde stapel trekken.
// Drie krachten: hergebruik van ingrediënten (kortere boodschappenlijst),
// de duimpjes van het huishouden, en variatie (niets twee keer per week).
// Wat de afgelopen weken op tafel stond. Zonder deze rem levert het
// hergebruik-mechanisme wel een korte lijst op, maar week na week dezelfde.
function recentlyUsed(weeksBack){
  const out={};
  for(let w=-(weeksBack||4); w<0; w++){
    const wk=lsGet(weekStoreKey(w),null); if(!wk)continue;
    DAYS.forEach(d=>ROWS.forEach(row=>{
      const rc=wk[d]&&wk[d][row.id];
      if(rc&&rc.id&&!isLeftover(rc)) out[rc.id]=(out[rc.id]||0)+1;
    }));
  }
  return out;
}
function genScore(rc, ctx){
  let s = Math.random() * 0.9;                    // houdt het levendig
  if(ctx.usedIds.has(rc.id)) s -= 100;            // niet twee keer dezelfde week
  s -= (ctx.recent&&ctx.recent[rc.id]||0) * 1.6;  // pas gegeten? even iets anders
  if(S.wiz.useRatings){
    const r = rateScore(rc.id);
    if(r <= -2) s -= 50;                          // door iedereen afgeschoten
    else s += r * 2.5;
  }
  if(S.wiz.reuse){
    const keys = ingKeys(rc);
    let overlap = 0;
    keys.forEach(k=>{ if(ctx.used[k]) overlap++; });
    s += overlap * 1.3;                           // beloon wat al op de lijst staat
    s -= (keys.length - overlap) * 0.35;          // straf elke nieuwe regel licht
  }
  return s;
}
function genTake(pool, ctx){
  if(!pool.length) return null;
  const ranked = pool.map(rc=>({rc, s:genScore(rc, ctx)})).sort((a,b)=>b.s-a.s);
  // Niet altijd de absolute winnaar: dat zou elke week hetzelfde menu geven.
  const top = ranked.slice(0, Math.min(3, ranked.length));
  const rc = top[Math.floor(Math.random()*top.length)].rc;
  ctx.usedIds.add(rc.id);
  ingKeys(rc).forEach(k=>{ ctx.used[k]=(ctx.used[k]||0)+1; });
  return rc;
}
// Pool voor één slot: juiste categorie, juiste persoon, en wat Shelley mijdt eruit.
function genPool(cat, who){
  return ALL().filter(rc=>{
    if(rc.category!==cat)return false;
    if(losseCat(rc.category))return false;
    if(who==="dirk"&&rc.voor==="shelley")return false;
    if(who==="shelley"&&rc.voor==="dirk")return false;
    return true;
  });
}
function lockKey(wo,day,rowId){return `${wo}_${day}_${rowId}`;}
function wizIsLocked(wo,day,rowId){return !!S.wiz.locks[lockKey(wo,day,rowId)];}
function wizToggleLock(wo,day,rowId){
  const k=lockKey(wo,day,rowId);
  const l={...S.wiz.locks};
  if(l[k])delete l[k];else l[k]=true;
  S.wiz.locks=l;set({});
}
// Eén slot opnieuw trekken, met de rest van de week als context zodat het
// nieuwe recept nog steeds bij de boodschappen past.
function wizRerollSlot(wo,day,rowId){
  const row=ROWS.find(r=>r.id===rowId);if(!row)return;
  const ctx={used:{},usedIds:new Set(),recent:recentlyUsed(4)};
  Object.values(S.wiz.preview||{}).forEach(w=>Object.values(w||{}).forEach(d=>{
    Object.entries(d||{}).forEach(([rid,rc])=>{
      if(!rc||isLeftover(rc))return;
      if(rid===rowId&&d===((S.wiz.preview[wo]||{})[day]))return;  // dit slot zelf niet
      ctx.usedIds.add(rc.id);
      ingKeys(rc).forEach(k=>{ctx.used[k]=(ctx.used[k]||0)+1;});
    });
  }));
  // Het recept dat er nu staat telt als "gebruikt", anders kan opnieuw
  // trekken hetzelfde gerecht opleveren en lijkt de knop stuk.
  const huidig=(((S.wiz.preview[wo]||{})[day])||{})[rowId];
  if(huidig&&huidig.id!=null)ctx.usedIds.add(huidig.id);
  const rc=genTake(genPool(row.cat,rowWho(row)),ctx);
  if(!rc){toast("Geen ander recept beschikbaar");return;}
  S.wiz.preview[wo][day][rowId]=rc;
  set({});
}

// De wizard opent met een voorstel, niet met een vragenlijst: eerst zien
// wat je krijgt, dan bijstellen.
function wizStart(){
  S.wizOpen=true;
  S.wiz.locks={};
  S.wiz.weeks=[0];   // volgende week zet je er zelf bij
  wizGenPreview(false);
}
// Welke weken de wizard aanraakt. Los van de daginstellingen, zodat het
// aanvinken van "volgende week" niets in de opslag achterlaat.
function wizWeeks(){ return (S.wiz.weeks&&S.wiz.weeks.length)?S.wiz.weeks:[0]; }
function wizToggleWeek(wo){
  const w=wizWeeks();
  S.wiz.weeks = w.includes(wo) ? w.filter(x=>x!==wo) : [...w,wo].sort();
  if(!S.wiz.weeks.length)S.wiz.weeks=[0];
  // Een week erbij of eraf verandert het voorstel, dus opnieuw rekenen —
  // vastgezette slots blijven daarbij staan.
  const stap=S.wizStep;
  wizGenPreview(false);
  set({wizStep:stap});
}

function wizGenPreview(force){
  const prev = {}; // {wo: {day: {rowId: rc}}}
  const old = S.wiz.preview || {};
  const ctx = {used:{}, usedIds:new Set(), recent:recentlyUsed(4)};

  // Vastgezette slots eerst inlezen: ze staan vast én ze tellen mee als
  // context, zodat de rest van de week erop aansluit.
  wizWeeks().forEach(wo=>{
    DAYS.forEach(day=>{
      ROWS.forEach(row=>{
        if(!wizIsLocked(wo,day,row.id))return;
        const rc=old[wo]&&old[wo][day]&&old[wo][day][row.id];
        if(!rc||isLeftover(rc))return;
        ctx.usedIds.add(rc.id);
        ingKeys(rc).forEach(k=>{ctx.used[k]=(ctx.used[k]||0)+1;});
      });
    });
  });

  wizWeeks().forEach(wo=>{
    prev[wo]={};
    const existingWeek=lsGet(weekStoreKey(wo),emptyWeek());
    DAYS.forEach(day=>{
      const dc=dayCfgAt(wo,day);
      if(!dc.plan){
        prev[wo][day]=existingWeek[day]?{...existingWeek[day]}:{};return;
      }
      prev[wo][day]={};
      rowsFor(day,wo).forEach(row=>{
        // Op slot gezet? Dan blijft het staan, ook bij opnieuw genereren.
        if(wizIsLocked(wo,day,row.id)&&old[wo]&&old[wo][day]&&old[wo][day][row.id]!==undefined){
          prev[wo][day][row.id]=old[wo][day][row.id];return;
        }
        if(!force&&existingWeek[day]&&existingWeek[day][row.id]){
          const ex=existingWeek[day][row.id];
          prev[wo][day][row.id]=ex;
          if(ex&&!isLeftover(ex)){ctx.usedIds.add(ex.id);ingKeys(ex).forEach(k=>{ctx.used[k]=(ctx.used[k]||0)+1;});}
          return;
        }
        let pool=genPool(row.cat,rowWho(row));
        // Maximale kooktijd van die dag respecteren, maar nooit ten koste van
        // een leeg bord: past er niets binnen, dan valt hij terug op alles.
        if(dc.maxTijd){
          const past=pool.filter(rc=>{const m=parseInt(rc.time);return !m||m<=dc.maxTijd;});
          if(past.length)pool=past;
        }
        prev[wo][day][row.id]=genTake(pool,ctx);
      });
    });
  });

  // Apply vaste (pinned) recipes — override random picks
  (S.wiz.vasteRc||[]).forEach(pin=>{
    if(!pin.rc||!pin.days.length)return;
    pin.days.forEach(({wo,day})=>{
      if(!dayCfgAt(wo,day).plan)return;
      if(prev[wo]&&prev[wo][day]!==undefined)prev[wo][day][pin.rowId]=pin.rc;
    });
  });
  S.wiz.preview=prev;
  set({wizStep:4});
}


function wizSwapSlot(wo, day, rowId){
  set({wizSlotPicker:{wo,day,rowId}, search:""});
}
function wizAssignSlot(rcId){
  const rc = getRc(rcId);
  if(!rc || !S.wizSlotPicker) return;
  const {wo,day,rowId} = S.wizSlotPicker;
  S.wiz.preview[wo][day][rowId] = rc;
  set({wizSlotPicker:null});
}
function wizClearSlot(wo,day,rowId){
  S.wiz.preview[wo][day][rowId] = null;
  set({});
}
// Haalt eerst het bijschrift op via de link, en analyseert dan.
async function wizFetchAndImport(){
  const url=(document.getElementById("wiz-ig-url")||{value:""}).value.trim();
  if(!url){toast("Plak eerst een Instagram link");return;}
  if(!S.geminiKey){toast("Vul je Gemini API key in bij Recepten → Instagram");return;}
  set({wizIgSt:"fetching",wizIgErr:"",wizIgUrl:url});
  const cap=await igFetchCaption(url);
  if(!cap){
    set({wizIgSt:"err",wizIgErr:"Het bijschrift kon niet worden opgehaald. Open de post, tik op ··· → Kopieer bijschrift, en plak het hieronder."});
    return;
  }
  set({wizIgCap:cap,wizIgSt:null});
  const ta=document.getElementById("wiz-ig-cap");if(ta)ta.value=cap;
  await wizDoImport();

async function wizDoImport(){

  const url=((document.getElementById("wiz-ig-url")||{value:""}).value||S.wizIgUrl||"").trim();

  if(!S.geminiKey){set({wizIgSt:"err",wizIgErr:"Vul eerst je Gemini API key in bij Recepten → + Eigen recept of Instagram import → Instagram."});return;}
  set({wizIgSt:"loading",wizIgErr:"",wizIgPrev:null,wizIgCap:cap});
  try{
    const p=await igExtractRecipe({text:cap},S.geminiKey,m=>set({wizIgSt:"loading",wizIgErr:m}));
    const rc={id:Date.now(),ebook:0,custom:true,voor:"beiden",...p,link:url||null};
    S.custom=[...S.custom,rc]; lsSet(CK,S.custom);
    const {wo,day,rowId}=S.wizSlotIg;
    S.wiz.preview[wo][day][rowId]=rc;
    set({wizIgSt:null,wizIgErr:"",wizSlotIg:null,wizIgPrev:null,wizIgCap:"",wizIgUrl:""});
    toast("Recept geïmporteerd en ingepland");
  }catch(e){ set({wizIgSt:"err",wizIgErr:e.message||"Mislukt"}); }

    {k:"reuse",title:"Boodschappen beperken",sub:"Kiest recepten die ingrediënten delen — kortere lijst, minder dat wegrot."},

}
function wizAllDays(wo,on){
  DAYS.forEach(d=>{
    const all=(wo===(S.weekOffset||0))?{...S.dayCfg}:lsGet(dayCfgStoreKey(wo),{});
    all[d]={...dayCfgAt(wo,d),plan:on};
    if(wo===(S.weekOffset||0))S.dayCfg=all; else lsSet(dayCfgStoreKey(wo),all);
  });
  set({});
}
function wizCycleTijd(wo,day){
  const cur=dayCfgAt(wo,day).maxTijd;
  const i=TIJD_OPTIES.indexOf(cur);
  setDayCfgAt(wo,day,{maxTijd:TIJD_OPTIES[(i+1)%TIJD_OPTIES.length]});
}

function wizToggleVasteDay(rowId,wo,day){
  const pin=S.wiz.vasteRc.find(p=>p.rowId===rowId);if(!pin)return;
  const has=pin.days.some(d=>d.wo===wo&&d.day===day);
  pin.days=has?pin.days.filter(d=>!(d.wo===wo&&d.day===day)):[...pin.days,{wo,day}];
  set({});
}
function wizRemoveVaste(rowId){
  S.wiz.vasteRc=S.wiz.vasteRc.filter(p=>p.rowId!==rowId);set({});
}
function wizPickVasteRow(rowId){
  set({wizVastePicker:{step:'rc',rowId},search:''});
}
function wizPickVasteRc(rcId){
  const rc=getRc(rcId);if(!rc||!S.wizVastePicker||S.wizVastePicker.step!=='rc')return;
  const rowId=S.wizVastePicker.rowId;
  const existing=S.wiz.vasteRc.find(p=>p.rowId===rowId);
  if(existing){existing.rc=rc;}else{S.wiz.vasteRc=[...S.wiz.vasteRc,{rowId,rc,days:[]}];}
  set({wizVastePicker:null,search:''});
}

// STAP 4 — Het voorstel. Dit is waar de wizard begint en waar je terugkomt.
function renderWizStep4(){
  const prev = S.wiz.preview;
  if(!prev||!Object.keys(prev).length){
    return `<div class="empty"><div class="empty-title">Even rekenen…</div></div>`;
  }
  const ingSet=new Set(); let lockCount=0;
  Object.entries(prev).forEach(([wo,weekData])=>Object.entries(weekData||{}).forEach(([day,slots])=>{
    if(!dayCfgAt(Number(wo),day).plan)return;
    Object.entries(slots||{}).forEach(([rid,rc])=>{
      if(wizIsLocked(wo,day,rid))lockCount++;
      if(rc&&!isLeftover(rc))ingKeys(rc).forEach(k=>ingSet.add(k));
    });
  }));

  const slotRow=(wo,day,row,rc)=>{
    const locked=wizIsLocked(wo,day,row.id);
    return `
    <div class="meal">
      <span class="meal-slot">${row.label}${row.apart?" · D":""}</span>
      <button class="meal-body" style="text-align:left;background:none" onclick="wizSwapSlot(${wo},'${day}','${row.id}')">
        <span class="meal-name">${rc?esc(rc.name):"leeg"}</span>
        ${rc?`<span class="meal-meta"><span class="num">${esc(rc.time)}</span>${rateBadge(rc.id)}</span>`:""}
      </button>
      <span class="meal-side">
        <button class="iconbtn" onclick="wizToggleLock(${wo},'${day}','${row.id}')" aria-pressed="${locked}"
          title="${locked?"Losmaken":"Vastzetten"}" style="${locked?"color:var(--accent)":""}">${ic(locked?"slot":"slotOpen",16)}</button>
        <button class="iconbtn" onclick="wizRerollSlot(${wo},'${day}','${row.id}')" ${locked?"disabled":""}
          title="Ander recept" aria-label="Ander recept">${ic("opnieuw",16)}</button>
      </span>
    </div>`;
  };

  return `
  <h2 class="sheet-title">Jullie weekmenu</h2>
  <p class="sheet-sub">Zet vast wat goed is, trek de rest opnieuw.</p>
  <div style="display:flex;gap:var(--s-2);flex-wrap:wrap;margin:var(--s-3) 0 var(--s-4)">
    <span class="chip">${ic("mandje",14)}&nbsp;<span class="num">${ingSet.size}</span>&nbsp;ingrediënten</span>
    ${lockCount?`<span class="chip" style="border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)">${ic("slot",14)}&nbsp;<span class="num">${lockCount}</span>&nbsp;vast</span>`:""}
    <button class="chip" onclick="set({wizStep:1})">${ic("instellingen",14)}&nbsp;Dagen &amp; tijd</button>
  </div>
  <div style="max-height:48vh;overflow-y:auto;margin:0 calc(var(--s-2) * -1);padding:0 var(--s-2)">
  ${wizWeeks().map(wo=>{
    const dagen=DAYS.filter(d=>dayCfgAt(wo,d).plan);
    if(!dagen.length)return"";
    const W=weekDates(wo);
    return `
    <p style="font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin:${wo===0?"0":"var(--s-5)"} 0 var(--s-2)">
      ${wo===0?"Deze week":"Volgende week"}<span class="num" style="color:var(--ink-3);font-weight:400"> · ${W.range}</span></p>
    ${dagen.map(day=>`
      <p style="font-size:var(--t-sm);font-weight:600;margin:var(--s-3) 0 var(--s-2)">
        ${DAY_FULL[day].charAt(0).toUpperCase()+DAY_FULL[day].slice(1)}<span class="num" style="color:var(--ink-3);font-weight:400"> ${W.nums[day]}</span>
        ${dayCfgAt(wo,day).maxTijd?`<span class="num" style="color:var(--ink-3);font-weight:400"> · max ${dayCfgAt(wo,day).maxTijd} min</span>`:""}</p>
      <div class="meals">
        ${rowsFor(day,wo).map(row=>slotRow(wo,day,row,prev[wo]&&prev[wo][day]&&prev[wo][day][row.id])).join("")}
      </div>`).join("")}`;
  }).join("")}
  </div>
  <div class="btn-row">
    <button class="btn btn-line" onclick="wizGenPreview(true)">${ic("opnieuw",17)} Opnieuw</button>
    <button class="btn btn-primary" onclick="set({wizStep:5})">Akkoord ${ic("verder",17)}</button>
  </div>`;
}

// STAP 5 — Wat heb je al in huis?
function renderWizStep5(){
  // Collect all ingredients from preview
  const allIng = {};
  Object.entries(S.wiz.preview).forEach(([wo,weekData])=>{
    Object.entries(weekData||{}).forEach(([dag,slots])=>{
      if(!dayCfgAt(Number(wo),dag).plan)return;
      rowsFor(dag,Number(wo)).forEach(row=>{
        const rc = slots && slots[row.id];
        if(!rc || isLeftover(rc))return;
        (rc.ingredients||[]).forEach(g=>{
          const k = (g.n||"").toLowerCase();
          if(!allIng[k]) allIng[k] = {name:g.n, delen:{}, los:[]};
          const it = allIng[k];
          const p = parseAmt(g.a);
          if(p.n!==null){
            const n = p.n*slotEters(dag,row.id)/(rcPorties(rc)||2);
            it.delen[p.eh]=(it.delen[p.eh]||0)+n;
          }else if(!p.smaak&&p.ruw&&!it.los.includes(p.ruw)) it.los.push(p.ruw);
        });
      });
    });
  });
  Object.values(allIng).forEach(it=>{
    it.amounts=[...Object.entries(it.delen).map(([eh,n])=>fmtAmt(n,eh)),...it.los];
  });
  const items = Object.entries(allIng);
  const inHuis = items.filter(([k])=>S.wiz.inHuis[k]).length;

  return `
  <div class="sheet-title">Wat heb je al in huis?</div>
  <div class="sheet-sub" style="margin-bottom:14px">Vink aan wat je al hebt — die halen we van de boodschappenlijst.</div>
  <div style="max-height:48vh;overflow-y:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);margin-bottom:14px">
    ${items.map(([k,it])=>{
      const chk = !!S.wiz.inHuis[k];
      return `
      <div onclick="wizToggleInHuis('${esc(k).replace(/'/g,"")}')"
        style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;${chk?"opacity:0.5":""}">
        <div class="check ${chk?"on":""}">${chk?ic("vink",13):""}</div>
        <span style="flex:1;font-size:14px;color:var(--ink)">${esc(it.name)}</span>
        ${it.amounts.length?`<span style="font-family:var(--num);font-size:11px;color:var(--ink-3)">${esc(it.amounts.join(", "))}</span>`:""}
      </div>`;
    }).join("")}
  </div>
  ${inHuis>0?`<div style="font-size:13px;color:var(--ok);margin-bottom:10px;font-weight:600">${inHuis} ingrediënten al in huis — worden niet besteld</div>`:""}
  <div class="btn-row">
    <button class="btn btn-line" onclick="set({wizStep:4})">${ic("terug",17)} Terug</button>
    <button class="btn btn-primary" onclick="wizFinish()">${ic("vink",17)} Week inplannen</button>
  </div>`;
}

// ===================== EXTRA WIZARD HELPERS =====================
function wizFinish(){
  // Apply preview to correct week(s) in localStorage
  wizWeeks().forEach(wo=>{
    if(!S.wiz.preview[wo]) return;
    const plannedDays=DAYS.filter(d=>dayCfgAt(wo,d).plan);
    if(!plannedDays.length) return;
    const isCurrentWeek=wo===(S.weekOffset||0);
    const weekData=isCurrentWeek?{...S.week}:lsGet(weekStoreKey(wo),emptyWeek());
    plannedDays.forEach(day=>{
      // Samenvoegen: verborgen rijen (Dirk apart) blijven staan.
      if(S.wiz.preview[wo][day]) weekData[day]={...weekData[day],...S.wiz.preview[wo][day]};
    });
    lsSet(weekStoreKey(wo),weekData);
    if(isCurrentWeek) S.week={...weekData};
  });
  // Apply in-huis to checked (pre-check items they already have)
  Object.keys(S.wiz.inHuis).forEach(k=>{
    if(S.wiz.inHuis[k]) S.checked[k] = true;
  });
  lsSet(CHK, S.checked);
  lsSet(CFG, S.cfg);
  set({wizOpen:false, wizStep:4});
  toast("Week ingepland");
}
