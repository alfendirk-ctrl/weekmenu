<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weekmenu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   TOKENS
   Warme, rustige neutralen met één accent. Het accent is er voor
   de primaire actie, de huidige selectie en status — nooit voor
   decoratie. De drie persoonskleuren zijn datakleuren: gelijke
   lichtheid, zodat niemand harder schreeuwt dan de ander.
   ============================================================ */
:root{
  --canvas:oklch(0.984 0.005 70);
  --surface:oklch(1 0 0);
  --surface-2:oklch(0.966 0.007 70);
  --surface-3:oklch(0.944 0.009 70);
  --line:oklch(0.902 0.008 70);
  --line-2:oklch(0.845 0.011 70);

  --ink:oklch(0.235 0.014 60);
  --ink-2:oklch(0.475 0.013 60);
  --ink-3:oklch(0.532 0.012 60);

  --accent:oklch(0.575 0.163 42);
  --accent-hover:oklch(0.525 0.163 42);
  --accent-on:oklch(0.99 0.008 42);
  --accent-soft:oklch(0.955 0.032 42);
  --accent-line:oklch(0.808 0.088 42);

  --ok:oklch(0.545 0.113 152);
  --ok-soft:oklch(0.955 0.032 152);
  --warn:oklch(0.700 0.128 80);
  --warn-soft:oklch(0.960 0.036 82);
  --err:oklch(0.548 0.170 27);
  --err-soft:oklch(0.958 0.028 27);

  --p-shelley:oklch(0.545 0.155 22);
  --p-dirk:oklch(0.508 0.100 168);
  --p-maeve:oklch(0.552 0.115 78);
  --on-person:oklch(1 0 0);
  --scrim:oklch(0.235 0.014 60/.40);

  --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --display:'Bricolage Grotesque',var(--sans);
  --num:'Space Mono',ui-monospace,monospace;

  /* Vaste rem-schaal, ratio ~1.2 — geen vloeiende koppen in een tool */
  --t-2xs:0.6875rem; --t-xs:0.75rem; --t-sm:0.8125rem; --t-md:0.9375rem;
  --t-base:1rem; --t-lg:1.125rem; --t-xl:1.375rem; --t-2xl:1.75rem; --t-3xl:2.25rem;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;

  --shadow-1:0 1px 2px oklch(0.235 0.014 60/.05), 0 2px 8px oklch(0.235 0.014 60/.05);
  --shadow-2:0 2px 6px oklch(0.235 0.014 60/.07), 0 12px 32px oklch(0.235 0.014 60/.09);
  color-scheme:light;
  --ease:cubic-bezier(.2,.8,.3,1);
  --rail-w:19rem;
}

/* ============================================================
   DONKER — 's ochtends vroeg en 's avonds laat staat deze app open.
   Niet de lichte versie omgekeerd: de accenten gaan omhoog in lichtheid
   zodat ze op een donkere grond nog steeds werken, en de tekst op een
   persoonskleur wordt juist donker.
   ============================================================ */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:oklch(0.185 0.008 70);
    --surface:oklch(0.232 0.010 70);
    --surface-2:oklch(0.212 0.009 70);
    --surface-3:oklch(0.278 0.012 70);
    --line:oklch(0.318 0.012 70);
    --line-2:oklch(0.408 0.014 70);
    --ink:oklch(0.945 0.008 70);
    --ink-2:oklch(0.762 0.011 70);
    --ink-3:oklch(0.618 0.011 70);
    --accent:oklch(0.705 0.150 45);
    --accent-hover:oklch(0.765 0.145 45);
    --accent-on:oklch(0.205 0.020 45);
    --accent-soft:oklch(0.302 0.048 45);
    --accent-line:oklch(0.452 0.090 45);
    --ok:oklch(0.720 0.128 152);
    --ok-soft:oklch(0.288 0.042 152);
    --warn:oklch(0.790 0.128 80);
    --warn-soft:oklch(0.300 0.046 82);
    --err:oklch(0.700 0.155 27);
    --err-soft:oklch(0.295 0.052 27);
    --p-shelley:oklch(0.672 0.152 22);
    --p-dirk:oklch(0.665 0.108 168);
    --p-maeve:oklch(0.762 0.122 78);
    --on-person:oklch(0.205 0.012 60);
    --scrim:oklch(0.120 0.008 70/.62);
    --shadow-1:0 1px 2px oklch(0 0 0/.30), 0 2px 8px oklch(0 0 0/.26);
    --shadow-2:0 2px 6px oklch(0 0 0/.36), 0 12px 32px oklch(0 0 0/.44);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:oklch(0.185 0.008 70);
  --surface:oklch(0.232 0.010 70);
  --surface-2:oklch(0.212 0.009 70);
  --surface-3:oklch(0.278 0.012 70);
  --line:oklch(0.318 0.012 70);
  --line-2:oklch(0.408 0.014 70);
  --ink:oklch(0.945 0.008 70);
  --ink-2:oklch(0.762 0.011 70);
  --ink-3:oklch(0.618 0.011 70);
  --accent:oklch(0.705 0.150 45);
  --accent-hover:oklch(0.765 0.145 45);
  --accent-on:oklch(0.205 0.020 45);
  --accent-soft:oklch(0.302 0.048 45);
  --accent-line:oklch(0.452 0.090 45);
  --ok:oklch(0.720 0.128 152);
  --ok-soft:oklch(0.288 0.042 152);
  --warn:oklch(0.790 0.128 80);
  --warn-soft:oklch(0.300 0.046 82);
  --err:oklch(0.700 0.155 27);
  --err-soft:oklch(0.295 0.052 27);
  --p-shelley:oklch(0.672 0.152 22);
  --p-dirk:oklch(0.665 0.108 168);
  --p-maeve:oklch(0.762 0.122 78);
  --on-person:oklch(0.205 0.012 60);
  --scrim:oklch(0.120 0.008 70/.62);
  --shadow-1:0 1px 2px oklch(0 0 0/.30), 0 2px 8px oklch(0 0 0/.26);
  --shadow-2:0 2px 6px oklch(0 0 0/.36), 0 12px 32px oklch(0 0 0/.44);
  color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}

/* Browser-oppervlakken horen ook bij het ontwerp */
::selection{background:var(--accent-soft);color:var(--ink)}
html{scrollbar-color:var(--line-2) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
:where(input,textarea){caret-color:var(--accent)}

html,body{background:var(--canvas);font-family:var(--sans);color:var(--ink);
  font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh}
body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex:0 0 auto}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================
   SHELL — mobiel één kolom, desktop een zijnavigatie
   ============================================================ */
.shell{display:flex;flex-direction:column;min-height:100dvh}
.app{flex:1;min-width:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.view{max-width:46rem;margin:0 auto;padding:0 var(--s-5)}

@media (min-width:900px){
  .shell{flex-direction:row}
  .app{padding-bottom:0;min-height:100dvh}
  .view{max-width:64rem;padding:0 var(--s-8)}
}
@media (min-width:1280px){
  .view{max-width:82rem}
  :root{--rail-w:22rem}
}

/* ============================================================
   NAVIGATIE — onderin op mobiel, zijkant op desktop
   ============================================================ */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding:var(--s-2) var(--s-2) calc(var(--s-2) + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:var(--s-2) var(--s-1);border-radius:var(--r-md);color:var(--ink-3);
  transition:color .16s var(--ease),background .16s var(--ease)}
.nav-item .label{font-size:var(--t-2xs);font-weight:600;letter-spacing:.01em}
.nav-item:hover{color:var(--ink-2)}
.nav-item.active{color:var(--accent)}
@media (min-width:900px){
  .nav{position:sticky;top:0;bottom:auto;left:auto;right:auto;height:100dvh;width:6rem;
    flex-direction:column;justify-content:flex-start;gap:var(--s-1);
    border-top:none;border-right:1px solid var(--line);background:var(--surface-2);
    padding:var(--s-5) var(--s-2)}
  .nav-item{flex:0 0 auto}
  .nav-item:hover{background:var(--surface-3)}
  .nav-item.active{background:var(--accent-soft)}
}

/* ============================================================
   PAGINAKOP
   ============================================================ */
.page-head{padding:var(--s-6) 0 var(--s-4)}
.page-title{font-family:var(--display);font-weight:700;font-size:var(--t-2xl);
  letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.page-sub{color:var(--ink-2);font-size:var(--t-md);margin-top:var(--s-2);line-height:1.5;max-width:42ch}
@media (min-width:900px){.page-title{font-size:var(--t-3xl)}}

.weeknav{display:flex;align-items:center;gap:var(--s-1);margin-bottom:var(--s-3)}
.weeknav-label{font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:var(--t-xs);color:var(--ink-2);padding:0 var(--s-2)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-md);
  color:var(--ink-2);background:transparent;border:1px solid transparent;
  transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease)}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn:active{background:var(--line)}
.iconbtn:disabled{opacity:.35;background:transparent}
.iconbtn.bordered{border-color:var(--line);background:var(--surface)}
.iconbtn.danger:hover{background:var(--err-soft);color:var(--err)}

/* ============================================================
   PLANNER — weekrail + dagpaneel
   ============================================================ */
.planner{display:flex;flex-direction:column}
.railcol{display:contents}
.rail{order:1}
.daypane{order:2}
.weekbox{order:3}
@media (min-width:900px){
  .planner{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);
    gap:var(--s-8);align-items:start}
  .railcol{display:block;position:sticky;top:var(--s-6)}
  .daypane{min-width:0}
}
.weekbox{margin:var(--s-5) 0 var(--s-6)}
.weekstat{display:flex;justify-content:space-between;align-items:baseline;
  padding:var(--s-3) 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.weekstat:last-of-type{border-bottom:none}
.weekstat span:last-child{color:var(--ink-2)}

.rail{display:flex;gap:var(--s-2);overflow-x:auto;padding:var(--s-1) 0 var(--s-3);
  scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (min-width:900px){
  .rail{display:block;overflow:visible;padding:0}
}

.daycard{flex:0 0 auto;scroll-snap-align:start;min-width:4.5rem;
  display:flex;flex-direction:column;align-items:center;gap:var(--s-1);
  padding:var(--s-3) var(--s-2);border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  transition:border-color .16s var(--ease),background .16s var(--ease),color .16s var(--ease)}
.daycard:hover{border-color:var(--line-2)}
.daycard.active{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.daycard.off{opacity:.45}
.dc-day{font-size:var(--t-2xs);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.dc-num{font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:var(--t-lg);font-weight:700;line-height:1}
.dc-bar{display:flex;gap:2px;width:100%;justify-content:center}
.dc-tick{width:5px;height:5px;border-radius:99px;background:var(--line)}
.dc-tick.on{background:var(--ok)}
.daycard.active .dc-tick{background:color-mix(in oklch,var(--accent-on) 45%,transparent)}
.daycard.active .dc-tick.on{background:var(--accent-on)}

@media (min-width:900px){
  .daycard{width:100%;min-width:0;flex-direction:row;align-items:center;gap:var(--s-3);
    text-align:left;margin-bottom:var(--s-2);padding:var(--s-3) var(--s-4)}
  .dc-num{font-size:var(--t-base);width:1.6rem;text-align:right}
  .dc-day{width:1.8rem}
  .dc-bar{justify-content:flex-start;width:auto;margin-left:auto}
  .dc-tick{width:5px}
}

/* Dagkop met bediening */
.day-head{display:flex;align-items:center;gap:var(--s-2);
  padding-bottom:var(--s-3);border-bottom:1px solid var(--line);margin-bottom:var(--s-4)}
.day-name{font-family:var(--display);font-weight:700;font-size:var(--t-xl);
  letter-spacing:-.025em;line-height:1.1;flex:1;min-width:0}
.day-name .dn-date{font-family:var(--num);font-variant-numeric:tabular-nums;
  color:var(--ink-3);font-weight:400;font-size:var(--t-md);margin-left:var(--s-2)}

.controls{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-bottom:var(--s-5)}

/* Schakelaar — echte switch, geen vinkje dat zich voordoet als switch */
.switch{display:inline-flex;align-items:center;gap:var(--s-2);
  padding:var(--s-2) var(--s-3);border-radius:99px;background:var(--surface);
  border:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-2);
  transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)}
.switch:hover{border-color:var(--line-2);color:var(--ink)}
.switch.on{border-color:var(--accent-line);color:var(--ink);background:var(--accent-soft)}
.sw-track{position:relative;width:30px;height:18px;border-radius:99px;
  background:var(--line-2);transition:background .18s var(--ease);flex:0 0 auto}
.sw-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;
  background:var(--surface);box-shadow:var(--shadow-1);transition:transform .18s var(--ease)}
.switch.on .sw-track{background:var(--accent)}
.switch.on .sw-knob{transform:translateX(12px)}

/* Segmenten — voor de kooktijd */
.segs{display:inline-flex;padding:2px;border-radius:99px;background:var(--surface-3);
  border:1px solid var(--line)}
.seg{padding:6px var(--s-3);border-radius:99px;font-size:var(--t-xs);font-weight:600;
  color:var(--ink-3);transition:background .16s var(--ease),color .16s var(--ease)}
.seg:hover{color:var(--ink-2)}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg-label{font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap}

/* ============================================================
   MAALTIJDEN — een lijst met haarlijnen, geen stapel kaarten
   ============================================================ */
.meals{border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);overflow:hidden}
.meal{display:flex;align-items:center;gap:var(--s-4);width:100%;text-align:left;
  padding:var(--s-4);border-bottom:1px solid var(--line);
  transition:background .14s var(--ease)}
.meal:last-child{border-bottom:none}
.meal:hover{background:var(--surface-2)}
.meal-slot{flex:0 0 5.5rem;font-size:var(--t-xs);font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.meal-body{flex:1;min-width:0}
.meal-name{font-weight:600;font-size:var(--t-md);line-height:1.3;color:var(--ink);
  overflow-wrap:break-word}
.meal.empty .meal-name{color:var(--ink-3);font-weight:400}
.meal-meta{display:flex;align-items:center;gap:var(--s-2);margin-top:3px;
  font-size:var(--t-xs);color:var(--ink-3)}
.meal-meta .num{font-size:var(--t-xs)}
.meal-side{display:flex;align-items:center;gap:var(--s-2);flex:0 0 auto;color:var(--ink-3)}
.meal-sub{padding-left:calc(5.5rem + var(--s-4))}
@media (max-width:560px){
  .meal{display:grid;grid-template-columns:minmax(0,1fr) auto;
    align-items:center;gap:2px var(--s-3);padding:var(--s-3) var(--s-4)}
  .meal-slot{grid-column:1/-1;flex-basis:auto;font-size:var(--t-2xs);padding:0 0 2px}
  .meal-body{grid-column:1}
  .meal-side{grid-column:2;grid-row:2}
}

.lijstkop{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-4);
  background:var(--surface);margin-bottom:var(--s-4)}
.lijstkop-rij{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3)}
.lijstkop-titel{font-weight:600;font-size:var(--t-md)}
.lijstkop-tijd{font-size:var(--t-xs);color:var(--ink-3)}
.lijstkop-sub{font-size:var(--t-xs);color:var(--ink-3);line-height:1.6;margin-top:var(--s-1)}
.lijstkop-los{border-style:dashed}
.lijstwaarschuwing{display:flex;gap:var(--s-4);align-items:center;flex-wrap:wrap;
  border:1px solid var(--warn);border-radius:var(--r-lg);padding:var(--s-4);
  background:var(--warn-soft);margin-bottom:var(--s-4)}
.lijstwaarschuwing>div{flex:1;min-width:11rem}
.lijstwaarschuwing strong{font-size:var(--t-md)}
.lijstwaarschuwing p{font-size:var(--t-xs);color:var(--ink-2);line-height:1.6;margin-top:var(--s-1)}
.lijstwaarschuwing .btn{width:auto;flex:0 0 auto}
.bood-acties{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-bottom:var(--s-5)}
.bood-acties .btn{width:auto;flex:0 0 auto}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);
  font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--accent-hover)}
.linkbtn:active{opacity:.7}
.eters{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.eter{display:inline-flex;align-items:center;gap:var(--s-2);padding:4px 10px 4px 4px;
  border:1px solid var(--line);border-radius:99px;background:var(--surface);
  font-size:var(--t-xs);font-weight:600;color:var(--ink-3);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.eter:hover{border-color:var(--line-2);color:var(--ink-2)}
.eter:active{transform:translateY(1px)}
.eter.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.eter .who{opacity:.35;transition:opacity .15s}
.eter.on .who{opacity:1}
.who{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;
  font-family:var(--num);font-size:10px;font-weight:700;color:var(--on-person);flex:0 0 auto}
.who-stack{display:flex}
.who-stack .who+.who{margin-left:-6px;box-shadow:0 0 0 1.5px var(--surface)}
.meal:hover .who-stack .who+.who{box-shadow:0 0 0 1.5px var(--surface-2)}

.notefield{width:100%;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);padding:var(--s-4);font-size:var(--t-md);line-height:1.5;
  resize:vertical;min-height:4.5rem;margin-top:var(--s-3);outline:none;
  transition:border-color .16s var(--ease)}
.notefield:focus{border-color:var(--accent-line)}
.notefield::placeholder{color:var(--ink-3)}

.dayoff{padding:var(--s-8) var(--s-5);text-align:center;border:1px dashed var(--line-2);
  border-radius:var(--r-lg);color:var(--ink-3);font-size:var(--t-md)}

/* ============================================================
   KNOPPEN
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  border-radius:var(--r-md);padding:var(--s-3) var(--s-5);font-weight:600;
  font-size:var(--t-md);width:100%;line-height:1.2;
  transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.btn-primary{background:var(--accent);color:var(--accent-on)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{background:var(--line-2);color:var(--surface)}
.btn-ink{background:var(--ink);color:var(--surface)}
.btn-ink:hover{background:oklch(0.34 0.014 60)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn-line:disabled{color:var(--ink-3);background:var(--surface);border-color:var(--line)}
.btn-quiet{color:var(--ink-2);padding:var(--s-2) var(--s-3);width:auto}
.btn-quiet:hover{background:var(--surface-3);color:var(--ink)}
.btn-row{display:flex;gap:var(--s-2);margin-top:var(--s-4)}
.btn-row .btn{flex:1}

.plan-cta{margin:var(--s-5) 0 var(--s-6)}
.badge{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--t-2xs);
  padding:2px 7px;border-radius:99px;background:color-mix(in oklch,currentColor 20%,transparent)}

/* ============================================================
   RECEPTEN / SNACKS
   ============================================================ */
.search{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:var(--s-3) var(--s-4);font-size:var(--t-md);
  outline:none;margin-bottom:var(--s-3);transition:border-color .16s var(--ease)}
.search:focus{border-color:var(--accent-line)}
.search::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:var(--s-2);overflow-x:auto;padding-bottom:var(--s-2);
  margin-bottom:var(--s-4);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:var(--s-2);
  padding:7px var(--s-3);border-radius:99px;background:var(--surface);
  border:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.reclist{display:grid;gap:var(--s-2)}
@media (min-width:700px){.reclist{grid-template-columns:1fr 1fr}}
@media (min-width:1200px){.reclist{grid-template-columns:1fr 1fr 1fr}}
.rec{display:flex;align-items:flex-start;gap:var(--s-3);text-align:left;width:100%;
  padding:var(--s-4);border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);transition:border-color .16s var(--ease),background .14s var(--ease)}
.rec:hover{border-color:var(--line-2);background:var(--surface-2)}
.rec-body{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:var(--t-md);line-height:1.3;overflow-wrap:break-word}
.rec-meta{font-size:var(--t-xs);color:var(--ink-3);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.rec-cat{font-size:var(--t-2xs);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* ============================================================
   BOODSCHAPPEN
   ============================================================ */
.progress{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:var(--s-4);margin-bottom:var(--s-5)}
.progress-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:var(--s-3)}
.progress-fill{height:100%;background:var(--ok);border-radius:99px;transition:width .3s var(--ease)}
.bood-group{margin-bottom:var(--s-6)}
.bood-head{display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:var(--s-2);padding-bottom:var(--s-2);border-bottom:1px solid var(--line)}
.bood-title{font-weight:600;font-size:var(--t-md)}
.bood-list{border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);overflow:hidden}
.bood-item{display:flex;align-items:center;gap:var(--s-3);width:100%;text-align:left;
  padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--line);
  transition:background .14s var(--ease)}
.bood-item:last-child{border-bottom:none}
.bood-item:hover{background:var(--surface-2)}
.bood-item.checked .bi-name{text-decoration:line-through;color:var(--ink-3)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:var(--surface);flex:0 0 auto;
  transition:background .16s var(--ease),border-color .16s var(--ease)}
.check:hover{border-color:var(--ink-3)}
.check.on{background:var(--ok);border-color:var(--ok)}
.bi-name{flex:1;font-size:var(--t-md);min-width:0;overflow-wrap:break-word}
.bi-amt{font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:var(--t-xs);color:var(--ink-3);flex:0 0 auto}

/* ============================================================
   MODALEN — alleen waar de taak echt onderbreking verdient
   ============================================================ */
.overlay{position:fixed;inset:0;background:var(--scrim);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media (min-width:640px){.overlay{align-items:center;padding:var(--s-6)}}
.sheet{background:var(--surface);width:100%;max-width:34rem;max-height:90dvh;overflow-y:auto;
  overscroll-behavior:contain;border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--s-5) var(--s-5) calc(env(safe-area-inset-bottom,0px) + var(--s-6));
  box-shadow:var(--shadow-2)}
@media (min-width:640px){.sheet{border-radius:var(--r-xl)}}
.sheet-head{display:flex;align-items:flex-start;gap:var(--s-3);margin-bottom:var(--s-4)}
.sheet-title{font-family:var(--display);font-weight:700;font-size:var(--t-xl);
  letter-spacing:-.025em;line-height:1.15;flex:1;text-wrap:balance}
.sheet-sub{color:var(--ink-2);font-size:var(--t-sm);margin-top:var(--s-1);line-height:1.5}

.tabs{display:flex;gap:var(--s-1);border-bottom:1px solid var(--line);margin-bottom:var(--s-4)}
.tab{padding:var(--s-3) var(--s-4);font-size:var(--t-sm);font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .16s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}

.ing-line{display:flex;justify-content:space-between;gap:var(--s-4);
  padding:var(--s-3) 0;border-bottom:1px solid var(--line);font-size:var(--t-md)}
.ing-line:last-child{border-bottom:none}
.step-line{display:flex;gap:var(--s-3);margin-bottom:var(--s-4)}
.step-num{flex:0 0 auto;width:22px;height:22px;border-radius:99px;background:var(--surface-3);
  color:var(--ink-2);font-family:var(--num);font-size:var(--t-2xs);font-weight:700;
  display:grid;place-items:center}
.step-txt{font-size:var(--t-md);line-height:1.55;flex:1}

.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
@media (min-width:640px){.picker-grid{grid-template-columns:1fr 1fr 1fr}}
.picker-card{text-align:left;padding:var(--s-3);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);
  transition:border-color .16s var(--ease),background .14s var(--ease)}
.picker-card:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.pc-name{font-weight:600;font-size:var(--t-sm);line-height:1.3;overflow-wrap:break-word}
.pc-meta{font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:var(--t-2xs);color:var(--ink-3);margin-top:var(--s-1)}

.field{margin-bottom:var(--s-4)}
.field label{display:block;font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin-bottom:var(--s-2)}
.field input,.field select,.field textarea{width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-3);
  font-size:var(--t-md);outline:none;transition:border-color .16s var(--ease)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-line)}
.field textarea{resize:vertical;line-height:1.55;min-height:5rem}
.row-fields{display:flex;gap:var(--s-3)}

.pick-row{display:flex;gap:var(--s-2)}
.pick-opt{flex:1;padding:var(--s-3);border-radius:var(--r-md);background:var(--surface);
  border:1px solid var(--line);font-size:var(--t-sm);font-weight:600;color:var(--ink-2);text-align:center;
  transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)}
.pick-opt:hover{border-color:var(--line-2)}
.pick-opt.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}

.note{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);
  padding:var(--s-3) var(--s-4);font-size:var(--t-sm);color:var(--ink-2);line-height:1.55}

.empty{text-align:center;padding:var(--s-10) var(--s-5);color:var(--ink-3)}
.empty-title{font-family:var(--display);font-weight:600;font-size:var(--t-lg);
  color:var(--ink);margin-bottom:var(--s-2)}
.empty p{font-size:var(--t-md);line-height:1.55;max-width:34ch;margin:0 auto}

/* ============================================================
   KOOKMODUS
   ============================================================ */
.cookview{position:fixed;inset:0;z-index:200;background:var(--canvas);
  display:flex;flex-direction:column;
  padding:max(var(--s-4),env(safe-area-inset-top)) var(--s-5) max(var(--s-4),env(safe-area-inset-bottom))}
.cook-inner{width:100%;max-width:44rem;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.cook-top{display:flex;align-items:center;gap:var(--s-3);padding-bottom:var(--s-3)}
.cook-name{font-family:var(--display);font-weight:700;font-size:var(--t-lg);
  letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-dots{display:flex;gap:3px;padding-bottom:var(--s-6)}
.cook-dot{flex:1;height:3px;border-radius:99px;background:var(--line);
  transition:background .16s var(--ease)}
.cook-dot.done{background:var(--ok)}
.cook-dot.now{background:var(--accent)}
.cook-body{flex:1;overflow-y:auto;min-height:0}
.cook-stepno{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-bottom:var(--s-3)}
.cook-steptxt{font-family:var(--display);font-weight:600;font-size:var(--t-2xl);
  line-height:1.28;letter-spacing:-.025em;text-wrap:balance;max-width:24ch}
@media (min-width:700px){.cook-steptxt{font-size:var(--t-3xl)}}
.cook-timerbtn{margin-top:var(--s-6);padding:var(--s-3) var(--s-5);border-radius:var(--r-md);
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);
  font-weight:600;font-size:var(--t-md);width:auto;display:inline-flex;align-items:center;gap:var(--s-2)}
.cook-timerbtn:hover{background:var(--accent);color:var(--accent-on)}
.cook-timer{display:flex;align-items:center;gap:var(--s-3);background:var(--accent);
  color:var(--accent-on);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-4)}
.cook-timer-num{font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:var(--t-xl);font-weight:700;line-height:1}
.cook-nav{display:flex;gap:var(--s-2);padding-top:var(--s-4)}

/* ============================================================
   RONDLEIDING — een kaart onderaan, niet een venster middenin,
   zodat je de app eronder blijft zien waar het over gaat.
   ============================================================ */
.tour-scrim{position:fixed;inset:0;z-index:150;background:var(--scrim);
  backdrop-filter:blur(2px);animation:tour-in .2s var(--ease);pointer-events:none}
.tour{position:fixed;z-index:153;left:var(--s-4);right:var(--s-4);
  bottom:calc(var(--s-4) + env(safe-area-inset-bottom));
  max-width:32rem;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-xl);
  padding:var(--s-5);box-shadow:var(--shadow-2);animation:tour-up .24s var(--ease)}
@media (min-width:900px){
  .tour{left:auto;right:var(--s-6);bottom:var(--s-6);width:26rem;margin:0}
}
.tour-head{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3)}
.tour-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-md);
  background:var(--accent-soft);color:var(--accent)}
.tour-tel{font-size:var(--t-xs);color:var(--ink-3)}
.tour-titel{font-family:var(--display);font-weight:700;font-size:var(--t-lg);
  letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--s-2);text-wrap:balance}
.tour-tekst{font-size:var(--t-md);line-height:1.6;color:var(--ink-2)}
.tour-stippen{display:flex;gap:4px;margin-top:var(--s-4)}
.tour-stip{flex:1;height:3px;border-radius:99px;background:var(--line)}
.tour-stip.gehad{background:var(--ok)}
.tour-stip.nu{background:var(--accent)}
/* Ruimte onderaan, anders kun je het laatste element niet vrij scrollen
   van de kaart die eroverheen ligt. */
body.tour-actief .app{padding-bottom:70vh}
.tour-uitgelicht{position:relative;z-index:151;border-radius:var(--r-lg);
  box-shadow:0 0 0 3px var(--accent), 0 0 0 12px var(--accent-soft);
  transition:box-shadow .2s var(--ease)}
@keyframes tour-in{from{opacity:0}to{opacity:1}}
@keyframes tour-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================
   TOAST
   ============================================================ */
#toast-host{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;display:flex;

.toast{background:var(--ink);color:var(--surface);border-radius:99px;

.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

// Alle stammen in één lijst, langste eerst: de langste treffer wint.
const BOOD_STAMMEN=Object.entries(BOOD_CATS)
  .flatMap(([cat,obj])=>obj.words.map(w=>[w.toLowerCase(),cat]))
  .sort((a,b)=>b[0].length-a[0].length)
  .map(([w,cat])=>{
    const esc=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    // kort = alleen aan het begin van een woord, lang = overal
    const bron=w.length<=3 ? "(^|[^a-z\u00e0-\u00ff])"+esc : esc;
    return [new RegExp(bron,"i"),cat];
  });
// Een paar samenstellingen laat de langste stam verkeerd vallen: "komijnekaas"
// is kaas en geen komijn, "shoarmakruiden" is een kruidenmix en geen vlees, en
// "tomatensaus" hoort in het schap bij de saus. Deze aanwijzingen gaan voor,
// van specifiek naar algemeen.
const BOOD_STERK=[
  [/pindakaas|kokosmelk|kokosroom/i,"blik_pot"],
  [/kaas/i,"zuivel"],
  [/melk/i,"zuivel"],
  [/kruiden|masala|poeder/i,"kruiden_olie"],
  [/saus|dressing|mayo|ketchup/i,"blik_pot"],
  [/wokgroent|roerbakgroent|groente/i,"groente_fruit"],
];
function getBoodCat(name){
  const n=" "+String(name||"").toLowerCase();
  for(const [re,cat] of BOOD_STERK){ if(re.test(n))return cat; }
  for(const [re,cat] of BOOD_STAMMEN){ if(re.test(n))return cat; }
  return "overig";
}

function emptyWeek(){const w={};DAYS.forEach(d=>{w[d]={};ROWS.forEach(row=>{w[d][row.id]=null});});return w;}

// Week dates: compute Mon-Sun for a given week offset (0=this week, 1=next, -1=last)
function weekDates(offsetWeeks=0){
  const now=new Date();
  now.setDate(now.getDate()+offsetWeeks*7);
  const day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-((day+6)%7));
  const nums={}; const out=[];
  DAYS.forEach((d,idx)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+idx);nums[d]=dt.getDate();out.push(dt);});
  const jan1=new Date(mon.getFullYear(),0,1);
  const wk=Math.ceil((((mon-jan1)/86400000)+jan1.getDay()+1)/7);
  const months=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  const range=`${out[0].getDate()}–${out[6].getDate()} ${months[out[6].getMonth()]}`;
  const key=`${mon.getFullYear()}_${wk}`;
  return {nums, wk, range, key};
}
// Sleutel op basis van de maandag-datum (YYYY-MM-DD) — nooit afhankelijk van weeknummer
function mondayStr(offsetWeeks){
  const now=new Date();now.setDate(now.getDate()+offsetWeeks*7);
  const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((day+6)%7));
  const y=mon.getFullYear(),m=String(mon.getMonth()+1).padStart(2,'0'),d=String(mon.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function weekStoreKey(offset){ return `wm_week_${mondayStr(offset)}`; }
function dayCfgStoreKey(offset){ return `wm_daycfg_${mondayStr(offset)}`; }
function notesStoreKey(offset){ return `wm_notes_${mondayStr(offset)}`; }
function curWeek(){ return weekDates(S.weekOffset||0); }
const MIGK="wm_weekkeys_migrated_v2";
// Eenmalige migratie van wm_week_YYYY_WW naar wm_week_YYYY-MM-DD.
// De oude sleutel telde weken vanaf zóndag; startDate is die zondag. De
// maandagweek die zes van die zeven dagen dekt begint een dag later — de
// vorige versie stapte terug naar de maandag ervóór en zette daarmee alles
// een week te vroeg, behalve wat op een zondag was opgeslagen.
function migrateOldWeekKeys(){
  if(lsGet(MIGK,false))return;
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&/^wm_(week|notes)_\d{4}_\d+$/.test(k))keys.push(k);
  }
  keys.forEach(k=>{
    const m=k.match(/^(wm_(?:week|notes))_(\d{4})_(\d+)$/);if(!m)return;
    const prefix=m[1],year=parseInt(m[2]),wk=parseInt(m[3]);
    const jan1=new Date(year,0,1);
    const startDate=new Date(year,0,1+(wk-1)*7-jan1.getDay());
    const mon=new Date(startDate);mon.setDate(startDate.getDate()+1);
    const y=mon.getFullYear(),mo=String(mon.getMonth()+1).padStart(2,'0'),d=String(mon.getDate()).padStart(2,'0');
    const nk=`${prefix}_${y}-${mo}-${d}`;
    const src=localStorage.getItem(k);
    // Bestaande data is leidend: nooit overschrijven.
    if(src&&!localStorage.getItem(nk))localStorage.setItem(nk,src);
    // Bron weg, anders komt een verwijderde week bij elke herlading terug.
    try{localStorage.removeItem(k);}catch(e){}
  });
  lsSet(MIGK,true);
}
// Vóór deze versie was het ontbijt altijd per persoon. Wie daar echt
// verschillende dingen had staan, wil apart eten niet ineens uit hebben.
const APARTMIGK="wm_apart_migrated_v1";
function migrateApartDefault(){
  if(lsGet(APARTMIGK,false))return;
  let split=false;
  for(let i=0;i<localStorage.length&&!split;i++){
    const k=localStorage.key(i);
    if(!k||!/^wm_week_\d{4}-\d{2}-\d{2}$/.test(k))continue;
    let wk;try{wk=JSON.parse(localStorage.getItem(k));}catch(e){continue;}
    if(!wk)continue;
    Object.values(wk).forEach(dag=>{
      if(!dag)return;
      const paren=[["ontbijt_dirk","ontbijt_shelley"],["lunch_dirk","lunch_shelley"]];
      paren.forEach(([a,b])=>{ if(dag[a]&&dag[b]&&dag[a].id!==dag[b].id)split=true; });
    });
  }
  if(split){
    const cfg=lsGet(CFG,{});cfg.apartEten=true;lsSet(CFG,cfg);
  }
  lsSet(APARTMIGK,true);
}
(function migrate(){
  const old=lsGet(SK,null);
  if(old){const k=weekStoreKey(0);if(!lsGet(k,null)){lsSet(k,old);}try{localStorage.removeItem(SK);}catch(e){}}
  const oldN=lsGet(NK,null);
  if(oldN){const k=notesStoreKey(0);if(!lsGet(k,null)){lsSet(k,oldN);}try{localStorage.removeItem(NK);}catch(e){}}
  migrateOldWeekKeys();
  migrateApartDefault();
})();

// ===================== SYNC =====================
// De sync draait op de achtergrond terwijl je typt. Alleen het wolkje
// bijwerken in plaats van de hele pagina hertekenen.
function syncStatus(st){
  S.syncSt=st;
  const b=document.querySelector('button[title="Synchronisatie"]');
  if(!b)return;
  b.style.color = st==="ok" ? "var(--ok)" : st==="err" ? "var(--err)" : "";
  b.innerHTML = st==="syncing" ? `<span class="spin">${ic("opnieuw",18)}</span>` : ic("wolk",18);
}

async function syncPush(){
  const hid=lsGet(HHID_KEY,null);if(!hid)return;
  syncStatus("syncing");
  try{
    const state={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      // GK (de Gemini API key) blijft bewust lokaal: weekmenu_sync is leesbaar
      // voor iedereen met de anon key, en die staat publiek in deze pagina.
      // MODK hoort bij de key van dít apparaat en heeft elders geen betekenis.
      if(k&&k.startsWith('wm_')&&k!==HHID_KEY&&k!==GK&&k!==MIGK&&k!==THK&&k!==MODK
         &&!/^wm_(week|notes)_\d{4}_\d+$/.test(k)){try{state[k]=JSON.parse(localStorage.getItem(k));}catch(e){}}
    }
    const {error}=await getSb().from('weekmenu_sync').upsert({household_id:hid,state,updated_at:new Date().toISOString()});
    syncStatus(error?"err":"ok");
  }catch(e){syncStatus("err");}
  // Bewust géén render: er is niets veranderd behalve het wolkje zelf.
  setTimeout(()=>syncStatus("idle"),3000);
}
async function syncPull(hid){
  hid=hid||lsGet(HHID_KEY,null);if(!hid)return;
  syncStatus("syncing");
  try{
    const {data,error}=await getSb().from('weekmenu_sync').select('state').eq('household_id',hid).single();
    if(!error&&data?.state){
      // Sla GK over, ook als een oudere rij hem nog bevat.
      Object.entries(data.state).forEach(([k,v])=>{if(k!==GK)localStorage.setItem(k,JSON.stringify(v));});
      S.custom=lsGet(CK,[]);S.checked=lsGet(CHK,{});
      S.cfg=lsGet(CFG,{store:"Albert Heijn",apartEten:false});
      S.boodOverride=lsGet(BOK,{});
      S.week=lsGet(weekStoreKey(S.weekOffset||0),emptyWeek());
      S.notes=lsGet(notesStoreKey(S.weekOffset||0),{});
      S.geminiKey=lsGet(GK,"");
      S.avondSnack=lsGet(SAK,{});
      S.ratings=lsGet(RTK,{});
      S.rcServings=lsGet(SRV,{});
      migrateOldWeekKeys(); // herstel foute sleutels na sync
      S.week=lsGet(weekStoreKey(S.weekOffset||0),emptyWeek());
      S.notes=lsGet(notesStoreKey(S.weekOffset||0),{});
      // Daginstellingen horen hier ook bij: zonder deze regel blijven de
      // schakelaars van de andere telefoon in het geheugen hangen.
      S.dayCfg=lsGet(dayCfgStoreKey(S.weekOffset||0),{});
      syncStatus("ok");
    }else{syncStatus(error?"err":"ok");}
    const n=await pullInbox(hid);
    if(n)toast(`${n} recept${n===1?"":"en"} uit je inbox toegevoegd`);
  }catch(e){syncStatus("err");}
  render();setTimeout(()=>syncStatus("idle"),3000);
}
// Recepten die via de Edge Function ig-import binnenkwamen ophalen en opnemen.
async function pullInbox(hid){
  try{
    const {data,error}=await getSb().from('recipe_inbox')
      .select('id,recipe,source_url').eq('household_id',hid).eq('consumed',false).order('id');
    if(error||!data||!data.length)return 0;
    const seen=new Set(S.custom.map(c=>(c.name||"").toLowerCase()));
    const add=[];
    data.forEach((r,i)=>{
      const rc=r.recipe;
      if(!rc||!rc.name||seen.has(rc.name.toLowerCase()))return;
      seen.add(rc.name.toLowerCase());
      add.push({id:Date.now()+i,ebook:0,custom:true,voor:"beiden",...rc,link:r.source_url||null});
    });
    if(add.length){S.custom=[...S.custom,...add];lsSet(CK,S.custom);}
    await getSb().from('recipe_inbox').update({consumed:true}).in('id',data.map(r=>r.id));
    return add.length;
  }catch(e){return 0;}
}

// ===================== HELPERS =====================
// Schaalt een hoeveelheid van "waar het recept voor is" naar "voor hoeveel
// je nu kookt". Werkt ook op "2 el" of "1½ blik" — alleen het eerste getal
// gaat mee, de rest van de tekst blijft staan.
// ---------- HOEVEELHEDEN ----------
// De recepten staan vol met "½ citroen", "2 tl" en "300g". Om te kunnen
// schalen én optellen moet dat eerst uit elkaar: een getal en een eenheid.
const BREUKEN={"\u00bd":0.5,"\u00bc":0.25,"\u00be":0.75,"\u2153":1/3,"\u2154":2/3,"\u215b":0.125};
// Eenheden waar een half getal logisch is. De rest koop je per stuk, en dan
// rond je naar boven af: anderhalf ei bestaat niet in de winkel.
const DEELBAAR=["g","kg","ml","l","dl","el","tl","cm"];
// Schrijfwijzen die hetzelfde betekenen, zodat 300g en 300 gram optellen.
const EENHEID_ALIAS={gram:"g",gr:"g",g:"g",kg:"kg",kilo:"kg",milliliter:"ml",ml:"ml",
  liter:"l",l:"l",dl:"dl",eetlepel:"el",eetlepels:"el",el:"el",
  theelepel:"tl",theelepels:"tl",tl:"tl",stuks:"",stuk:"",st:""};
// "naar smaak" is geen boodschap maar een aanwijzing.
const NAAR_SMAAK=["n.s.","ns","naar smaak","snufje","beetje","optioneel"];

function parseAmt(a){
  const ruw=String(a==null?"":a).trim();
  if(!ruw)return {n:null,eh:"",ruw,smaak:false};
  const m=ruw.match(/^(\d+(?:[.,]\d+)?)?\s*([\u00bd\u00bc\u00be\u2153\u2154\u215b])?\s*(.*)$/);
  let n=null;
  if(m[1])n=parseFloat(m[1].replace(",","."));
  if(m[2])n=(n||0)+BREUKEN[m[2]];
  if(n!==null&&isNaN(n))n=null;
  let eh=(m[3]||"").trim();
  const smaak=n===null&&NAAR_SMAAK.includes(eh.toLowerCase());
  const sleutel=eh.toLowerCase().replace(/\.$/,"");
  if(EENHEID_ALIAS[sleutel]!==undefined)eh=EENHEID_ALIAS[sleutel];
  return {n,eh,ruw,smaak};
}
// Terug naar tekst. Halven schrijven we als ½ — zo staan ze ook in de recepten.
function fmtGetal(n){
  const heel=Math.floor(n+1e-9), rest=n-heel;
  for(const [g,w] of Object.entries(BREUKEN)){
    if(Math.abs(rest-w)<0.02)return (heel?String(heel):"")+g;
  }
  return String(Math.round(n*10)/10).replace(".",",");
}
function fmtAmt(n,eh){
  if(n===null||n===undefined)return eh;
  let uit;
  if(eh==="g"||eh==="ml")uit=Math.round(n);          // geen halve grammen
  else if(DEELBAAR.includes(eh))uit=Math.round(n*10)/10;
  else uit=Math.ceil(n-1e-9);                        // stuks rond je naar boven af
  return fmtGetal(uit)+(eh?" "+eh:"");
}

function scaleAmt(amt,van,naar){
  if(!amt)return amt;
  const f=(naar||basisPorties())/(van||2);
  if(Math.abs(f-1)<0.01)return amt;
  const p=parseAmt(amt);
  if(p.n===null)return amt;             // "naar smaak", "handje" — niets te rekenen
  return fmtAmt(p.n*f,p.eh);
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(msg){const h=document.getElementById("toast-host");const t=document.createElement("div");t.className="toast";t.textContent=msg;h.appendChild(t);setTimeout(()=>t.remove(),2000);}

// ===================== INGREDIËNTEN =====================
// Normaliseert een ingrediëntnaam tot een sleutel waarop we kunnen vergelijken.
// "Verse spinazie" en "spinazie" horen als hetzelfde te tellen.
const ING_STOP=["verse","vers","bio","biologische","grote","kleine","gesneden","gehakte","bevroren","diepvries","rode","gele","groene","witte"];
function ingKey(name){
  let n=(name||"").toLowerCase().trim();
  n=n.replace(/\(.*?\)/g,"").replace(/[^a-zà-ÿ\s]/g," ");
  const w=n.split(/\s+/).filter(x=>x&&!ING_STOP.includes(x));
  return (w.join(" ")||n.trim());
}
function ingKeys(rc){
  const out=[];(rc&&rc.ingredients||[]).forEach(g=>{const k=ingKey(g.n);if(k&&!out.includes(k))out.push(k);});
  return out;
}

// ===================== WAARDERINGEN =====================
function rateOf(rcId){return S.ratings[rcId]||{};}
function setRating(rcId,who,val){
  const cur={...rateOf(rcId)};
  if(cur[who]===val)delete cur[who];else cur[who]=val;
  const all={...S.ratings};
  if(Object.keys(cur).length)all[rcId]=cur;else delete all[rcId];
  set({ratings:all});
}
// Som van de duimpjes: +1 per duim omhoog, −1 per duim omlaag. Alleen van wie
// deze week mee-eet: een gerecht dat Shelley niet lust hoort een week zonder
// haar niet te blokkeren.
function rateScore(rcId){
  const r=rateOf(rcId), es=eters();
  return Object.keys(r).filter(w=>es.includes(w)).reduce((a,w)=>a+r[w],0);
}
function rateBadge(rcId){
  const r=rateOf(rcId);const es=eters();const keys=Object.keys(r).filter(w=>es.includes(w));
  if(!keys.length)return "";
  return `<span style="display:inline-flex;align-items:center;gap:3px">`+keys.map(w=>{
    const p=PEOPLE[w];if(!p)return"";
    return `<span title="${p.label} ${r[w]>0?"vond het lekker":"vond het niet lekker"}"
      style="display:inline-flex;align-items:center;color:${r[w]>0?"var(--ok)":"var(--err)"}">${ic(r[w]>0?"duimOmhoog":"duimOmlaag",12)}<span style="font-size:9px;font-weight:700">${p.initial}</span></span>`;
  }).join("")+`</span>`;
}

// Een restjesslot is geen kopie van het recept maar een verwijzing ernaar.
// Zonder eigen ingrediënten, zodat de boodschappenlijst niets dubbeltelt —
// in plaats daarvan koken we op de bróndag een portie extra.
function makeLeftover(rc){
  return {id:`lo_${rc.id}`, leftoverOf:rc.id, ebook:rc.ebook, custom:rc.custom,
    name:`Restjes: ${rc.name}`, category:rc.category, time:"opwarmen",
    ingredients:[], steps:[`Restjes van ${rc.name} opwarmen.`], servings:rc.servings||2, voor:rc.voor||"beiden"};
}
function isLeftover(rc){return !!(rc&&rc.leftoverOf);}
// Telt per bronrecept hoeveel restjesdagen eraan hangen, zodat we op de
// kookdag genoeg inkopen.
function leftoverCounts(week){
  const c={};
  DAYS.forEach(d=>ROWS.forEach(row=>{
    const rc=week[d]&&week[d][row.id];
    if(isLeftover(rc))c[rc.leftoverOf]=(c[rc.leftoverOf]||0)+1;
  }));
  return c;
}
// Diners die deze week gepland staan en als restje hergebruikt kunnen worden.
function leftoverSources(day){
  const out=[];
  DAYS.forEach(d=>{
    if(d===day)return;
    const rc=S.week[d]&&S.week[d]["diner"];
    if(!rc||isLeftover(rc))return;
    if(out.some(o=>o.rc.id===rc.id))return;
    out.push({day:d,rc});
  });
  return out;
}

function tourMarkeer(){
  document.querySelectorAll(".tour-uitgelicht").forEach(el=>el.classList.remove("tour-uitgelicht"));
  const bezig=S.tour!==null&&S.tour!==undefined;
  document.body.classList.toggle("tour-actief",bezig);
  if(!bezig)return;
  const sel=(TOUR[S.tour]||{}).markeer;
  if(!sel)return;
  const el=document.querySelector(sel);
  if(!el)return;
  el.classList.add("tour-uitgelicht");
  // De kaart staat onderaan, dus mikken we het uitgelichte deel in de
  // bovenste helft. Anders licht je iets uit dat achter de kaart verdwijnt.
  const kaart=document.querySelector(".tour");
  const vrij=kaart?kaart.getBoundingClientRect().top:window.innerHeight;
  const r=el.getBoundingClientRect();
  if(r.top<8||r.bottom>vrij-16){
    // Past het niet in de vrije ruimte, dan lijnen we de bovenkant uit;
    // anders zetten we het netjes in het midden daarvan.
    const marge = r.height>vrij-32 ? 16 : Math.max(16,(vrij-r.height)/2);
    window.scrollTo({top:Math.max(0,window.scrollY+r.top-marge),behavior:"smooth"});
  }
}

// ===================== PORTIES =====================
// Twee getallen, en dat onderscheid is het hele punt:
//   1. voor hoeveel personen een recept geschreven is (rcPorties)
//   2. voor hoeveel personen jij het die dag kookt (slotPorties)
// De hoeveelheden schalen van het eerste naar het tweede.
const HH_DEFAULT = 3;
// Hoeveel monden er standaard aan tafel zitten: precies wie er mee-eet.
// S.cfg.huishouden had nooit een knop en zou de eterschips stilzwijgend
// overrulen, dus die is eruit.
function basisPorties(){ return Math.max(1, eters().length) || HH_DEFAULT; }

// Wat het recept zelf zegt, tenzij jij het hebt gecorrigeerd.
function rcPorties(rc){
  if(!rc)return 2;
  const eigen=S.rcServings[rc.id];
  if(Number(eigen)>0)return Number(eigen);
  return Number(rc.servings)>0?Number(rc.servings):2;
}
function setRcPorties(rcId,n){
  const alle={...S.rcServings};
  if(Number(n)>0)alle[rcId]=Number(n);else delete alle[rcId];
  set({rcServings:alle});
}

// Hoeveel monden een slot standaard voedt: precies de mensen die daar eten.
function slotEters(day,rowId){
  const es=eters();
  if(rowId==="diner")return es.length;
  const row=ROWS.find(r=>r.id===rowId);
  if(row&&row.apart)return 1;                      // alleen Dirk
  if(row&&dayCfg(day).apart&&row.who==="shelley")return 1;  // alleen Shelley
  return Math.max(1,es.filter(p=>p!=="maeve").length); // Maeve eet alleen mee met het diner
}
// Wat er voor dit slot gekookt wordt: jouw keuze, anders het aantal eters.
function slotPorties(day,rowId){
  const rc=S.week[day]&&S.week[day][rowId];
  if(rc&&Number(rc.porties)>0)return Number(rc.porties);
  return slotEters(day,rowId);
}
function setSlotPorties(day,rowId,n){
  const rc=S.week[day]&&S.week[day][rowId];
  if(!rc)return;
  const bij={...rc};
  if(Number(n)>0)bij.porties=Number(n);else delete bij.porties;
  S.week={...S.week,[day]:{...S.week[day],[rowId]:bij}};
  if(S.detail&&S.detail.day===day&&S.detail.rowId===rowId)S.detail={...S.detail,rc:bij};
  set({});
}

// ===================== ETERS =====================
// Wie er mee-eet. Vaste stand in S.cfg.eters, per week te overrulen — hetzelfde
// patroon als dayCfg: de keuze voor déze week wint, anders de vaste stand.
// Alles hangt hieraan: porties, avatars, de generator, de duimpjes en de
// export. Eén lijst, geen losse uitzonderingen per plek.
const ALLE_ETERS = Object.keys(PEOPLE);
function etersKey(offset){ return `wm_eters_${mondayStr(offset)}`; }
function etersDefault(){
  const v=S.cfg&&S.cfg.eters;
  return Array.isArray(v)&&v.length ? v : ALLE_ETERS;
}
// Onthouden binnen één render: rateBadge vraagt dit per receptkaart op, en dat
// zijn er ruim honderd. render() gooit de cache weg.
let _etersCache=null;
function etersAt(wo){
  const k=wo===undefined?(S.weekOffset||0):wo;
  if(_etersCache&&_etersCache.k===k)return _etersCache.v;
  const w=lsGet(etersKey(k),null);
  const lijst=Array.isArray(w)&&w.length ? w : etersDefault();
  const v=ALLE_ETERS.filter(p=>lijst.includes(p));   // altijd dezelfde volgorde
  _etersCache={k,v};
  return v;
}
function eters(){ return etersAt(S.weekOffset||0); }
function eetMee(p){ return eters().includes(p); }
// Heeft deze week een eigen keuze, of volgt hij de vaste stand?
function etersEigen(wo){
  const w=lsGet(etersKey(wo===undefined?(S.weekOffset||0):wo),null);
  return Array.isArray(w)&&w.length>0;
}
function toggleEter(p){
  const nu=eters();
  const bij = nu.includes(p) ? nu.filter(x=>x!==p) : [...nu,p];
  if(!bij.length){toast("Er moet iemand mee-eten");return;}
  lsSet(etersKey(S.weekOffset||0), ALLE_ETERS.filter(x=>bij.includes(x)));
  set({});
}
function etersAlsVast(){
  S.cfg={...S.cfg,eters:eters()};
  try{localStorage.removeItem(etersKey(S.weekOffset||0));}catch(e){}
  set({});
  toast("Vaste stand bijgewerkt");
}
function etersTerug(){
  try{localStorage.removeItem(etersKey(S.weekOffset||0));}catch(e){}
  set({});
}
// Apart eten gaat over Shelley en Dirk uit elkaar houden. Eet er maar één van
// die twee mee, dan is er niets om te splitsen.
function kanApart(wo){
  const e=etersAt(wo===undefined?(S.weekOffset||0):wo);
  return e.includes("shelley")&&e.includes("dirk");
}
// De "shelley"-rij is de gedeelde maaltijd. Eet Shelley niet mee, dan is dat
// gewoon Dirks bord — en dan moeten de voor-wie-filters dat ook zo lezen.
function rowWho(row){
  if(!row)return "samen";
  if(row.who==="shelley"&&!eetMee("shelley"))return eetMee("dirk")?"dirk":"samen";
  if(row.who==="dirk"&&!eetMee("dirk"))return eetMee("shelley")?"shelley":"samen";
  return row.who;
}

// ===================== DAGINSTELLINGEN =====================
// Per dag: plannen ja/nee, apart eten ja/nee, en hoeveel tijd je hebt.
// De planner en de wizard schrijven allebei hierin — één bron.
const TIJD_OPTIES=[0,15,30,45];
function rawDayCfg(wo){
  return (wo===(S.weekOffset||0)) ? S.dayCfg : lsGet(dayCfgStoreKey(wo),{});
}
function dayCfgAt(wo,day){
  const d=(rawDayCfg(wo)||{})[day]||{};
  return {
    plan: d.plan!==false,
    apart: kanApart(wo) && (d.apart===undefined ? !!S.cfg.apartEten : !!d.apart),
    maxTijd: d.maxTijd||0,
  };
}
function dayCfg(day){ return dayCfgAt(S.weekOffset||0, day); }
function setDayCfg(day,patch){
  S.dayCfg={...S.dayCfg,[day]:{...dayCfg(day),...patch}};
  set({});
}
function setDayCfgAt(wo,day,patch){
  if(wo===(S.weekOffset||0))return setDayCfg(day,patch);
  const all=lsGet(dayCfgStoreKey(wo),{});
  all[day]={...dayCfgAt(wo,day),...patch};
  lsSet(dayCfgStoreKey(wo),all);
  set({});
}
// Welke maaltijdrijen die dag zichtbaar zijn. Apart eten voegt de tweede
// ontbijt- en lunchrij toe; staat het uit, dan blijft de opgeslagen keuze
// van Dirk gewoon staan maar telt hij nergens mee.
function rowsFor(day,wo){
  const apart=dayCfgAt(wo===undefined?(S.weekOffset||0):wo, day).apart;
  return ROWS.filter(r=>!r.free && (!r.apart || apart));
}

// ===================== WEEK STATS =====================
function weekStats(){
  let filled=0, total=0;
  DAYS.forEach(d=>{
    if(!dayCfg(d).plan)return;
    rowsFor(d).forEach(row=>{total++;if(S.week[d]&&S.week[d][row.id])filled++;});
  });
  return {filled,total,empty:total-filled};
}
function dayFillCount(day){
  let n=0;rowsFor(day).forEach(row=>{if(S.week[day]&&S.week[day][row.id])n++;});return n;
}
function dayRowCount(day){ return rowsFor(day).length; }
// Hoeveel losse ingrediënten de week kost — de maat waarop een
// boodschappenlijst pijn doet.
function weekIngCount(){
  const s=new Set();
  DAYS.forEach(d=>{
    if(!dayCfg(d).plan)return;
    rowsFor(d).forEach(row=>{
      const rc=S.week[d]&&S.week[d][row.id];
      if(rc&&!isLeftover(rc))ingKeys(rc).forEach(k=>s.add(k));
    });
  });
  return s.size;
}
function clearDay(day){
  const w={...(S.week[day]||{})};
  ROWS.forEach(row=>{ w[row.id]=null; });
  S.week={...S.week,[day]:w};
  set({});
  toast(`${DAY_FULL[day].charAt(0).toUpperCase()+DAY_FULL[day].slice(1)} leeggemaakt`);
}

// ===================== FILTERED RECIPES =====================
function recipesForRow(rowId){
  const row=ROWS.find(r=>r.id===rowId);
  return ALL().filter(rc=>{
    if(row){
      const who=rowWho(row);
      if(who==="dirk"&&rc.voor==="shelley")return false;
      if(who==="shelley"&&rc.voor==="dirk")return false;
      if(rc.category!==row.cat)return false;
    }
    if(S.search&&!rc.name.toLowerCase().includes(S.search.toLowerCase()))return false;
    return true;
  });
}

// ===================== BOODSCHAPPEN =====================
// De lijst wordt afgeleid uit de week, maar je winkelt met een lijst die
// stilstaat. Daarom leg je hem vast met "Lijst opmaken"; verandert de week
// daarna, dan zegt de app dat en beslis jij wanneer je bijwerkt. Je vinkjes en
// je handmatige correcties staan los (op naam), dus die overleven een update.
function boodLijstKey(offset){ return `wm_boodlijst_${mondayStr(offset)}`; }
function boodLijstAt(wo){ return lsGet(boodLijstKey(wo),null); }
function boodLijst(){ return boodLijstAt(S.weekOffset||0); }

// Vingerafdruk van de week: welk recept in welk slot, en voor hoeveel monden.
// Verandert er iets aan een van die twee, dan klopt de lijst niet meer.
function weekSlots(){
  const uit={};
  DAYS.forEach(d=>{
    if(!dayCfg(d).plan)return;
    rowsFor(d).forEach(row=>{
      const rc=S.week[d]&&S.week[d][row.id];
      if(rc)uit[`${d}_${row.id}`]=String(rc.id)+"@"+slotPorties(d,row.id);
    });
  });
  return uit;
}
function boodVerschil(vast){
  if(!vast||!vast.slots)return 0;
  const nu=weekSlots(), oud=vast.slots;
  let n=0;
  new Set([...Object.keys(nu),...Object.keys(oud)]).forEach(k=>{ if(nu[k]!==oud[k])n++; });
  return n;
}
function lijstOpmaken(stil){
  const g=boodschappen();
  const items=Object.values(g).flat().map(it=>({name:it.name,cat:it.cat,amount:it.amount,sources:it.sources}));
  const slots=weekSlots();
  lsSet(boodLijstKey(S.weekOffset||0),{
    op:Date.now(), eters:eters(), dagen:DAYS.filter(d=>dayCfg(d).plan).length,
    maaltijden:Object.keys(slots).length, slots, items,
  });
  clearTimeout(window._syncT);window._syncT=setTimeout(syncPush,3000);
  set({});
  if(!stil)toast(items.length?`Lijst opgemaakt · ${items.length} regels`:"De week is nog leeg");
}
function lijstBijwerken(){ lijstOpmaken(true); toast("Lijst bijgewerkt"); }
function lijstLosmaken(){
  try{localStorage.removeItem(boodLijstKey(S.weekOffset||0));}catch(e){}
  clearTimeout(window._syncT);window._syncT=setTimeout(syncPush,3000);
  set({});
}
// Wat er op het scherm hoort: de vastgelegde lijst als die er is, anders live.
function boodGroepen(){
  const vast=boodLijst();
  if(!vast)return boodschappen();
  const grouped={};Object.keys(BOOD_CATS).forEach(c=>grouped[c]=[]);
  (vast.items||[]).forEach(it=>{(grouped[it.cat]=grouped[it.cat]||[]).push(it);});
  return grouped;
}
function datumKort(ms){
  const d=new Date(ms), nu=new Date();
  const tijd=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const zelfde=d.toDateString()===nu.toDateString();
  const gister=new Date(nu);gister.setDate(nu.getDate()-1);
  if(zelfde)return "vandaag "+tijd;
  if(d.toDateString()===gister.toDateString())return "gisteren "+tijd;
  const dagen=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  if(nu-d<6*864e5)return dagen[d.getDay()]+" "+tijd;
  return d.getDate()+" "+["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"][d.getMonth()]+" "+tijd;
}
function namenOp(lijst){
  const n=(lijst||[]).map(p=>PEOPLE[p]&&PEOPLE[p].label).filter(Boolean);
  if(!n.length)return "niemand";
  if(n.length===1)return n[0];
  return n.slice(0,-1).join(", ")+" en "+n[n.length-1];
}

// De lijst als platte tekst, om te plakken of te delen. Afgevinkte regels gaan
// er niet in: je stuurt door wat er nog gehaald moet worden.
function boodTekst(){
  const g=boodGroepen(), vast=boodLijst();
  const W=curWeek();
  const uit=[`Boodschappen week ${W.wk} (${W.range})`];
  if(vast)uit.push(`Voor ${namenOp(vast.eters)} · ${vast.dagen} dagen · ${vast.maaltijden} maaltijden`);
  let over=0;
  Object.entries(BOOD_CATS).forEach(([cat,obj])=>{
    const items=(g[cat]||[]).filter(it=>!S.checked[it.name.toLowerCase()]);
    if(!items.length)return;
    uit.push("", obj.label.replace(/&amp;/g,"&"));
    items.forEach(it=>{
      const k=it.name.toLowerCase();
      const amt=S.boodOverride[k]||it.amount||"";
      uit.push("- "+it.name+(amt?"  "+amt:""));
      over++;
    });
  });
  if(!over)uit.push("","Alles staat afgevinkt.");
  return uit.join("\n");
}
async function kopieerBood(){
  try{ await navigator.clipboard.writeText(boodTekst()); toast("Lijst gekopieerd"); }
  catch(e){ toast("Kopiëren mag niet in deze browser"); }
}
async function deelBood(){
  const tekst=boodTekst();
  if(navigator.share){
    try{ await navigator.share({title:"Boodschappen",text:tekst}); return; }
    catch(e){ if(e&&e.name==="AbortError")return; }
  }
  kopieerBood();
}

function boodschappen(){
  const m={};
  const lo=leftoverCounts(S.week);
  DAYS.forEach(d=>{
  if(!dayCfg(d).plan)return;
  const gezien=new Set();
  rowsFor(d).forEach(row=>{
    const rc=S.week[d]&&S.week[d][row.id];if(!rc)return;
    if(isLeftover(rc))return;  // restjes koken we niet opnieuw
    // Eten twee mensen hetzelfde, dan koop je het één keer: de hoeveelheden
    // zijn al op het hele huishouden geschaald.
    const dedup=`${row.cat}:${rc.id}`;
    if(gezien.has(dedup))return; gezien.add(dedup);
    const extra=1+(lo[rc.id]||0);              // restjesdagen tellen als extra porties
    const naar=slotPorties(d,row.id)*extra;
    const van=rcPorties(rc)||2;
    (rc.ingredients||[]).forEach(g=>{
      const k=(g.n||"").toLowerCase();
      if(!m[k])m[k]={name:g.n,cat:getBoodCat(g.n),delen:{},los:[],smaak:false,sources:[]};
      const it=m[k];
      // Optellen per eenheid. Vier keer havermout werd hiervoor als
      // "70g + 40g + 120g + 60g" op de lijst gezet, en twee keer dezelfde
      // hoeveelheid verdween zelfs helemaal — daar viel niet mee te winkelen.
      const p=parseAmt(g.a);
      let toon;
      if(p.n!==null){
        const n=p.n*naar/van;
        it.delen[p.eh]=(it.delen[p.eh]||0)+n;
        toon=fmtAmt(n,p.eh);
      }else if(p.smaak){ it.smaak=true; toon="naar smaak"; }
      else { if(p.ruw&&!it.los.includes(p.ruw))it.los.push(p.ruw); toon=p.ruw; }
      it.sources.push({day:d,rcName:rc.name+(extra>1?` (incl. restjes)`:"")+` · ${naar}p`,amount:toon});
    });
  });
  });
  // Eenheden op een vaste volgorde: eerst wat je afweegt, dan lepels, dan stuks.
  const EH_ORDE=["g","kg","ml","l","dl","el","tl"];
  Object.values(m).forEach(it=>{
    const delen=Object.entries(it.delen)
      .sort((a,b)=>{
        const ia=EH_ORDE.indexOf(a[0]), ib=EH_ORDE.indexOf(b[0]);
        return (ia<0?99:ia)-(ib<0?99:ib);
      })
      .map(([eh,n])=>fmtAmt(n,eh));
    it.amounts=[...delen,...it.los];
    it.amount=it.amounts.join(" + ")||(it.smaak?"naar smaak":"");
  });
  const grouped={};Object.keys(BOOD_CATS).forEach(c=>grouped[c]=[]);
  Object.values(m).forEach(it=>{(grouped[it.cat]=grouped[it.cat]||[]).push(it);});
  Object.values(grouped).forEach(v=>v.sort((a,b)=>a.name.localeCompare(b.name,"nl")));
  return grouped;
}
function toggleCheck(k){S.checked={...S.checked,[k]:!S.checked[k]};set({});}

}

// Zet een kleur om naar rgb() via het canvas, dat rekent exact hetzelfde als de
// verf op het scherm. Begrijpt het canvas de waarde niet, dan laten we hem staan.
function naarRgb(kleur){
  try{
    const c=document.createElement("canvas");c.width=c.height=1;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#010203";                       // onwaarschijnlijke ijkwaarde
    ctx.fillStyle=kleur;
    if(ctx.fillStyle==="#010203")return kleur;     // niet begrepen
    ctx.clearRect(0,0,1,1);ctx.fillRect(0,0,1,1);
    const d=ctx.getImageData(0,0,1,1).data;
    return d[3]===0 ? "rgba(0, 0, 0, 0)" : `rgb(${d[0]}, ${d[1]}, ${d[2]})`;
  }catch(e){ return kleur; }
}
// html2canvas 1.4.1 parseert de achtergrond van <html> en <body> altijd, ook als
// je maar één los element fotografeert. Dit hele thema staat in oklch() en die
// functie kent hij niet — hij gooit er een fout op nog voor er iets getekend is.
// Tijdens de export zetten we die twee dus even om naar exact dezelfde kleur in
// rgb(). Zelfde verf, dus je ziet er niets van.
function kleurenTijdelijkPlat(){
  const terug=[document.documentElement,document.body].map(el=>{
    const cs=getComputedStyle(el);
    const oud={bg:el.style.backgroundColor,kl:el.style.color};
    el.style.backgroundColor=naarRgb(cs.backgroundColor);
    el.style.color=naarRgb(cs.color);
    return {el,oud};
  });
  return ()=>terug.forEach(({el,oud})=>{el.style.backgroundColor=oud.bg;el.style.color=oud.kl;});
}

  const splitCell=(gedeeld,apartRc,kleur)=>

// Haalt het bijschrift op via onze eigen Edge Function. De browser mag
// Instagram niet rechtstreeks aanroepen (CORS), en de publieke proxy's waar dit
// eerder op leunde zijn gemeten dood: 403, 429 of 522. De functie komt er wel
// bij — met een iPhone-Safari-kenmerk levert Instagram het volledige bijschrift.
async function igFetchCaption(rawUrl){
  const hid=lsGet(HHID_KEY,null);
  if(!hid)return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),30000);
    let r;
    try{
      r=await fetch(SB_URL+"/functions/v1/ig-import",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+SB_KEY},
        body:JSON.stringify({url:rawUrl,household_id:hid,alleen_bijschrift:true}),
        signal:ctrl.signal,
      });
    }finally{clearTimeout(tid);}
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.caption)return null;
    return d.caption.length>=20?d.caption:null;
  }catch(e){return null;}
}

// Gedeeld vanuit Instagram: de Shortcut opent de app als
// ...?ig=<instagram-link>. De link houdt zijn eigen ?igsh=... , dus we knippen
// op het eerste voorkomen en nemen de rest ongewijzigd over — geen decodering
// nodig, en geen gedoe met dubbel gecodeerde parameters.
function gedeeldeLink(){
  const q=location.search||"";
  const i=q.indexOf("ig=");
  if(i<0)return null;
  const rest=q.slice(i+3);
  // "https%3A%2F%2F..." begint ook met "http", dus toets op het hele schema
  const url=/^https?:\/\//i.test(rest)?rest:decodeURIComponent(rest);
  return /^https?:\/\/(www\.)?instagram\.com\//i.test(url)?url:null;
}

// Meteen aan de slag met een gedeelde link. Het adres wordt daarna opgeschoond,
// zodat een herlaadbeurt niet nog een keer importeert.
async function verwerkGedeeld(){

  if(!url)return;
  history.replaceState(null,"",location.pathname);

      igErr:"Vul eerst je Gemini API key in, dan kan dit recept opgehaald worden."});

  set({view:"recepten",addOpen:true,addTab:"ig",igUrl:url});

}

{"name":"","category":"","time":"","servings":2,"ingredients":[{"n":"","a":""}],"steps":[""]}

- name: korte gerechtnaam, zonder emoji, hashtags of merknamen.

- steps: losse, volledige zinnen in de juiste volgorde. Laat stapnummers weg. Verzin geen stappen die er niet staan.
- Negeer hashtags, emoji, oproepen om te volgen/liken/taggen, links en reclame.
- Staat er geen recept in? Geef dan exact {"error":true}`;

const igPromptText=cap=>
`Je krijgt het bijschrift van een Instagram-post. Haal daar het recept uit.

${IG_RULES}

Bijschrift:
${cap}`;

const igPromptImg=n=>
`Je krijgt ${n===1?"een afbeelding":n+" afbeeldingen"} van een recept — bijvoorbeeld een screenshot van een Instagram-reel, een kookboekpagina of een foto van een receptkaart. Lees alle tekst die je ziet, ook tekst die over de video heen staat, en haal daar het recept uit.${n>1?" De afbeeldingen horen bij hetzelfde recept en staan op volgorde; combineer ze tot één recept zonder dingen dubbel te noemen.":""}

${IG_RULES}`;

// Gedeeld door de hoofdimport, de wizard-import en de foto-import.
// input is {text:"..."} of {images:[base64,...]}
// Fetch die niet eeuwig kan blijven hangen.
function fetchT(url,opts,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t));
}

async function igExtractRecipe(input,apiKey,onWait){
  const base="https://generativelanguage.googleapis.com/v1beta";
  const keyParam="?key="+encodeURIComponent(apiKey);
  // Geen vaste modelnamen meer: Google zet ze periodiek uit voor nieuwe keys
  // ("no longer available to new users"), waardoor elke hardgecodeerde lijst
  // veroudert. We vragen op wat déze key mag en rangschikken dat zelf.
  const fallback=["gemini-2.0-flash","gemini-2.5-flash","gemini-1.5-flash"];
  // Hoger = eerder proberen: nieuwste generatie eerst, flash boven pro
  // (sneller en goedkoper), preview/experimenteel achteraan.
  const rank=m=>{
    const v=parseFloat((m.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])||0;
    const kind=/flash-lite/.test(m)?2:/flash/.test(m)?3:/pro/.test(m)?1:0;
    const risky=/preview|exp\b|experimental|thinking/.test(m)?-2:0;
    return v*10+kind+risky;
  };
  let models=[...fallback], available=[];
  // De lijst verandert hooguit een paar keer per jaar, maar werd bij élke import
  // opgehaald — een volle rondgang naar Google voordat er iets kon gebeuren. Een
  // dag bewaren scheelt die stap; verandert er iets, dan is de lijst morgen bij.
  const bewaard=lsGet(MODK,null);
  if(bewaard&&bewaard.key===keyParam&&Date.now()-bewaard.at<864e5&&(bewaard.lijst||[]).length){
    models=bewaard.lijst;available=bewaard.alles||bewaard.lijst;
  }else{
    try{
      const lr=await fetchT(`${base}/models${keyParam}`,{},15000);
      if(lr.ok){
        const ld=await lr.json();
        available=(ld.models||[])
          .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
          .map(m=>m.name.replace("models/",""))
          // Beeldgeneratie, spraak en embeddings kunnen geen recept uitlezen.
          .filter(s=>!/image|imagen|tts|audio|embed|live|veo/i.test(s));
        if(available.length){
          models=[...available].sort((a,b)=>rank(b)-rank(a)).slice(0,4);
          lsSet(MODK,{key:keyParam,at:Date.now(),lijst:models,alles:available});
        }
      }
    }catch(e){}
  }

  const imgs=(input&&input.images)||[];
  const parts=imgs.length
    ? [{text:igPromptImg(imgs.length)},...imgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d}}))]
    : [{text:igPromptText((input&&input.text)||"")}];
  let lastErr="";
  const say=m=>{if(onWait)onWait(m);};
  for(let mi=0;mi<models.length;mi++){
    const model=models[mi];
    say(models.length>1
      ? `Analyseren met ${model} (${mi+1}/${models.length})…`
      : `Analyseren met ${model}…`);
    // JSON-modus voorkomt markdown-fences; valt terug als het model dat niet kent
    const callModel=json=>fetchT(`${base}/models/${model}:generateContent${keyParam}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts}],
         generationConfig:json?{temperature:0,responseMimeType:"application/json"}:{temperature:0}})},
      imgs.length?120000:90000);
    let res;
    try{
      res=await callModel(true);
      if(res.status===400)res=await callModel(false);
    }catch(e){
      // Niet meteen opgeven: een traag of onbereikbaar model betekent niet dat
      // de volgende het ook niet doet. Pas na het laatste model een melding.
      const traag=e&&e.name==="AbortError";
      lastErr=traag
        ? `${model} reageerde niet op tijd`
        : `geen verbinding met ${model}`;
      if(mi<models.length-1){say(traag?`${model} is traag, ik probeer de volgende…`:`Geen verbinding met ${model}, ik probeer de volgende…`);continue;}
      throw new Error(traag
        ? "Google reageerde niet op tijd. Probeer het zo nog eens — vaak lukt een tweede poging wel."
        : "Geen verbinding met Google. Controleer je internet.");
    }
    if(res.status===429){
      let errBody="";
      try{errBody=JSON.stringify(await res.json());}catch(e){}
      // "limit: 0" betekent gratis quota op — direct door naar het volgende model
      if(/limit:\s*0[,\s}"]/.test(errBody)||/"limit":\s*0[,}]/.test(errBody)){
        lastErr=`${model}: quota op`;continue;
      }
      // Hooguit 25s wachten, en maar één keer — anders staat de app minuten stil.
      let wait=15;
      const m2=errBody.match(/retry in ([\d.]+)s/i);if(m2)wait=Math.min(25,Math.ceil(parseFloat(m2[1]))+1);
      say(`Even wachten — ${model} zit aan zijn limiet. Opnieuw over ${wait}s…`);
      await new Promise(r=>setTimeout(r,wait*1000));
      say(`Opnieuw proberen met ${model}…`);
      try{res=await callModel(true);}
      catch(e){
        lastErr=`${model} reageerde niet op tijd`;
        if(mi<models.length-1)continue;
        throw new Error("Google reageerde niet op tijd. Probeer het zo nog eens.");
      }
    }
    if(!res.ok){
      let errMsg=`Model ${model}: fout ${res.status}`;
      try{const ed=await res.json();errMsg=ed?.error?.message||errMsg;}catch(e){}
      // 404 betekent meestal: dit model bestaat niet meer. Bewaarde lijst weg,
      // dan wordt hij bij de volgende poging vers opgehaald.
      if(res.status===404)lsSet(MODK,null);
      lastErr=errMsg;continue;
    }
    const data=await res.json();
    const txt=((data.candidates||[])[0]?.content?.parts||[])[0]?.text||"";
    const fi=txt.indexOf("{"),li=txt.lastIndexOf("}");
    if(fi<0||li<=fi){lastErr="Geen recept gevonden in de tekst";continue;}
    let p;
    try{p=JSON.parse(txt.slice(fi,li+1));}catch(e){lastErr="Antwoord was geen geldige JSON";continue;}
    if(p.error)throw new Error("Geen recept in dit bijschrift gevonden");
    const cats=["ontbijt","lunch","diner","tussendoortje"];
    return {
      name:(p.name||"").trim()||"Naamloos recept",
      category:cats.includes(p.category)?p.category:"diner",
      time:(p.time||"?").trim(),
      servings:Number(p.servings)>0?Math.round(Number(p.servings)):2,
      ingredients:(Array.isArray(p.ingredients)?p.ingredients:[])
        .map(g=>({n:(g&&g.n||"").trim(),a:(g&&g.a||"").trim()})).filter(g=>g.n),
      steps:(Array.isArray(p.steps)?p.steps:[]).map(s=>String(s).trim()).filter(Boolean),
    };
  }
  if(/quota op/i.test(lastErr)||/quota|rate limit/i.test(lastErr))
    throw new Error("Je gratis Gemini-quota is op. Die reset elke dag — probeer het morgen weer, of voeg betaling toe op ai.google.dev (ca. €0,001 per recept).");
  if(/no longer available|not found|not supported/i.test(lastErr))
    throw new Error(`Geen bruikbaar Gemini-model gevonden. Geprobeerd: ${models.join(", ")}.`
      +(available.length?` Beschikbaar voor jouw key: ${available.slice(0,8).join(", ")}.`:"")
      +` Melding: ${lastErr}`);
  throw new Error(lastErr||"Mislukt");
}

}
// ---------- FOTO / SCREENSHOT IMPORT ----------
// Schaalt terug naar max 1280px en comprimeert, zodat de request klein blijft.
function fileToB64(file){
  const MAX=1280, TIMEOUT=25000;
  const draw=(src,w,h)=>{
    if(!w||!h)throw new Error("lege afbeelding");
    let dw=w,dh=h;
    if(Math.max(dw,dh)>MAX){const sc=MAX/Math.max(dw,dh);dw=Math.round(dw*sc);dh=Math.round(dh*sc);}
    const c=document.createElement("canvas");c.width=dw;c.height=dh;
    c.getContext("2d").drawImage(src,0,0,dw,dh);
    return c.toDataURL("image/jpeg",0.85).split(",")[1];
  };
  const work=(async()=>{
    // 1. createImageBitmap leest de File rechtstreeks: decodeert ook HEIC van de iPhone
    //    en gebruikt veel minder geheugen dan een data-URL van megabytes.
    if(typeof createImageBitmap==="function"){
      try{
        const bm=await createImageBitmap(file);
        try{return draw(bm,bm.width,bm.height);}finally{if(bm.close)bm.close();}
      }catch(e){/* val terug op <img> */}
    }
    // 2. Object-URL in plaats van data-URL, om dezelfde reden.
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{
        const im=new Image();
        im.onload=()=>res(im);
        im.onerror=()=>rej(new Error("kan deze afbeelding niet lezen"));
        im.src=url;
      });
      return draw(img,img.naturalWidth,img.naturalHeight);
    }finally{URL.revokeObjectURL(url);}
  })();
  // 3. Harde tijdslimiet: het inlezen kan nooit blijven hangen.
  return Promise.race([work,new Promise((_,rej)=>
    setTimeout(()=>rej(new Error("duurde te lang")),TIMEOUT))]);
}
const PHOTO_MAX=6;
async function addPhotos(files){
  // Sommige iPhone-bestanden komen zonder type binnen; niet wegfilteren.
  const list=[...(files||[])].filter(f=>f&&(!f.type||f.type.startsWith("image/")));
  if(!list.length){toast("Geen afbeelding gevonden");return;}
  if((S.photos||[]).length>=PHOTO_MAX){toast(`Maximaal ${PHOTO_MAX} foto's`);return;}
  set({photoSt:"reading"});
  const added=[];let failed=0;
  try{
    for(const f of list){
      if((S.photos||[]).length+added.length>=PHOTO_MAX){toast(`Maximaal ${PHOTO_MAX} foto's`);break;}
      try{added.push(await fileToB64(f));}
      catch(e){failed++;console.warn("foto overgeslagen:",f&&f.name,e&&e.message);}
    }
  }finally{
    // Altijd uit de leesstatus, ook als er iets onverwachts misgaat.
    set({photos:[...(S.photos||[]),...added],photoSt:null,igSt:null,igErr:""});
  }
  if(failed)toast(added.length
    ? `${failed} foto${failed===1?"":"'s"} overgeslagen`
    : "Deze foto's konden niet worden gelezen — probeer een screenshot");
}
